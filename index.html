/* ---- storage shim: mimics the Claude artifact storage API on localStorage ---- */
(function () {
  if (window.storage) return;
  const P = "northflow-web:";
  window.storage = {
    async get(key) {
      const v = localStorage.getItem(P + key);
      if (v === null) throw new Error("key not found: " + key);
      return { key, value: v };
    },
    async set(key, value) { localStorage.setItem(P + key, String(value)); return { key, value }; },
    async delete(key) { localStorage.removeItem(P + key); return { key, deleted: true }; },
    async list(prefix) {
      const keys = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k.startsWith(P) && (!prefix || k.slice(P.length).startsWith(prefix))) keys.push(k.slice(P.length));
      }
      return { keys };
    },
  };
})();

/* ---------------- date helpers (weeks keyed by Monday ISO) ---------------- */
const DAY = 86400000;
function mondayOf(d) {
  const x = new Date(d);
  const day = (x.getDay() + 6) % 7;
  x.setHours(12, 0, 0, 0);
  return new Date(x.getTime() - day * DAY);
}
function wkKey(d) { return mondayOf(d).toISOString().slice(0, 10); }
function addW(key, n) { return wkKey(new Date(new Date(key + "T12:00:00").getTime() + n * 7 * DAY)); }
function wkDiff(a, b) { return Math.round((new Date(b + "T12:00:00") - new Date(a + "T12:00:00")) / (7 * DAY)); }
function fmtWk(key) {
  const d = new Date(key + "T12:00:00");
  return d.toLocaleDateString("en-GB", { day: "numeric", month: "short" });
}
const CUR_WK = wkKey(new Date());

/* ---------------- money ---------------- */
const CUR = "AED";
function money(v) {
  if (v === undefined || v === null || isNaN(v)) return "—";
  const n = Math.round(v);
  const s = Math.abs(n).toLocaleString("en-GB");
  return (n < 0 ? "-" : "") + CUR + " " + s;
}
function moneyK(v) {
  if (v === undefined || v === null || isNaN(v) || Math.round(v) === 0) return "—";
  const a = Math.abs(v), sign = v < 0 ? "-" : "";
  if (a >= 1000000) return sign + (a / 1000000).toFixed(2) + "m";
  if (a >= 10000) return sign + (a / 1000).toFixed(0) + "k";
  if (a >= 1000) return sign + (a / 1000).toFixed(1) + "k";
  return sign + Math.round(a);
}
const num = (s) => { const v = parseFloat(String(s).replace(/[£$,\sA-Za-z]/g, "")); return isNaN(v) ? 0 : v; };

/* ---------------- spread profiles ---------------- */
function weights(n, profile) {
  const w = [];
  for (let i = 0; i < n; i++) {
    if (profile === "linear") w.push(1);
    else if (profile === "front") w.push(n - i);
    else if (profile === "back") w.push(i + 1);
    else { // s-curve via smoothstep increments
      const t0 = i / n, t1 = (i + 1) / n;
      const S = (t) => 3 * t * t - 2 * t * t * t;
      w.push(S(t1) - S(t0));
    }
  }
  return w;
}
function spreadAmount(total, n, profile) {
  const w = weights(n, profile), sum = w.reduce((a, b) => a + b, 0);
  const arr = w.map((x) => Math.round((total * x) / sum));
  const drift = total - arr.reduce((a, b) => a + b, 0);
  arr[n - 1] += drift;
  return arr;
}
// build fc map: weekly spread from project start offset
function weeklyFc(projStart, total, fromWk, dur, profile) {
  const arr = spreadAmount(total, dur, profile), fc = {};
  arr.forEach((a, i) => { if (a) fc[addW(projStart, fromWk + i)] = a; });
  return fc;
}
// build fc map: 4-weekly payment cycle (valuation/application cadence)
function cycleFc(projStart, total, dur, profile, firstPay, cycle) {
  const w = spreadAmount(total, dur, profile);
  const fc = {}; let i = 0, payIdx = 0;
  while (i < dur) {
    const chunk = w.slice(i, i + cycle).reduce((a, b) => a + b, 0);
    if (chunk) {
      const k = addW(projStart, firstPay + payIdx * cycle);
      fc[k] = (fc[k] || 0) + chunk;
    }
    i += cycle; payIdx++;
  }
  return fc;
}

/* ---------------- deterministic rng for seed actuals ---------------- */
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* ---------------- core model helpers ----------------
   line = { id, name, type, value, fc:{wk:amt}, ac:{wk:amt}, recurring? }
   Cash-in lines live in project.cashIn[]; cash-out lines in package.lines[].
------------------------------------------------------ */
const uid = () => Math.random().toString(36).slice(2, 9);
const sumMap = (m) => Object.values(m || {}).reduce((a, b) => a + b, 0);

// Re-forecast a finite line: actualised weeks keep actuals; the unspent
// balance (value − actuals to date) is re-spread over remaining forecast
// weeks pro-rata to the original profile. Slipped weeks roll forward.
function lineProj(line, curWk) {
  const fc = line.fc || {}, ac = line.ac || {};
  const proj = {};
  const allWks = new Set([...Object.keys(fc), ...Object.keys(ac)]);
  if (line.recurring) {
    allWks.forEach((k) => {
      proj[k] = k < curWk ? (ac[k] !== undefined ? ac[k] : (fc[k] || 0)) : (ac[k] !== undefined ? ac[k] : (fc[k] || 0));
    });
    return { proj, remaining: null };
  }
  const isActualised = (k) => k < curWk || ac[k] !== undefined;
  let acSum = 0;
  Object.keys(ac).forEach((k) => { acSum += ac[k]; });
  const remaining = (line.value || 0) - acSum;
  const futureWks = [...allWks].filter((k) => !isActualised(k));
  const futureFcSum = futureWks.reduce((a, k) => a + (fc[k] || 0), 0);
  allWks.forEach((k) => { if (isActualised(k)) proj[k] = ac[k] !== undefined ? ac[k] : 0; });
  if (futureFcSum > 0.5) {
    const scale = remaining / futureFcSum;
    futureWks.forEach((k) => { proj[k] = Math.round((fc[k] || 0) * scale); });
  } else if (Math.abs(remaining) > 0.5) {
    proj[curWk] = (proj[curWk] || 0) + Math.round(remaining); // nothing left in plan: land balance now
  }
  return { proj, remaining };
}

function projectLines(p) {
  const inn = p.cashIn.map((l) => ({ ...l, dir: "in", group: "Cash in" }));
  const out = [];
  p.packages.forEach((pkg) => pkg.lines.forEach((l) => out.push({ ...l, dir: "out", group: pkg.name, pkgId: pkg.id })));
  return { inn, out, all: [...inn, ...out] };
}

// per-week aggregates for a project
function projectSeries(p, curWk) {
  const { inn, out } = projectLines(p);
  const agg = {}; // wk -> {fcIn, fcOut, acIn, acOut, prIn, prOut}
  const touch = (k) => (agg[k] = agg[k] || { fcIn: 0, fcOut: 0, acIn: 0, acOut: 0, prIn: 0, prOut: 0 });
  const roll = (lines, dir) => lines.forEach((l) => {
    const { proj } = lineProj(l, curWk);
    Object.entries(l.fc || {}).forEach(([k, v]) => { touch(k)[dir === "in" ? "fcIn" : "fcOut"] += v; });
    Object.entries(l.ac || {}).forEach(([k, v]) => { touch(k)[dir === "in" ? "acIn" : "acOut"] += v; });
    Object.entries(proj).forEach(([k, v]) => { touch(k)[dir === "in" ? "prIn" : "prOut"] += v; });
  });
  roll(inn, "in"); roll(out, "out");
  return agg;
}

function seriesToCurve(agg) {
  const wks = Object.keys(agg).sort();
  let cf = 0, cp = 0, ca = 0;
  return wks.map((k) => {
    const a = agg[k];
    cf += a.fcIn - a.fcOut; cp += a.prIn - a.prOut;
    let actual = null;
    if (k <= CUR_WK) { ca += a.acIn - a.acOut; actual = ca; }
    return { wk: k, label: fmtWk(k), forecast: cf, projected: cp, actual, netProj: a.prIn - a.prOut };
  });
}

      ]},
      { id: uid(), name: "Site prelims & consumables", vendor: "Various", lines: [
        mkPkgLine("Base package", "base", 112000, weeklyFc(s2, 112000, 0, 20, "linear")),
      ]},
    ],
  };

  // ---- P-103 Harbour Point (starts in 2 weeks — forecast only)
  const s3 = addW(CUR_WK, 2);
  const p3 = {
    id: uid(), code: "P-103", name: "Harbour Point — Retail Unit 4", client: "Grosvenor",
    start: s3, weeks: 10,
    cashIn: [
      { id: uid(), name: "Contract sum", type: "contract", value: 318000, fc: cycleFc(s3, 318000, 10, "scurve", 6, 4), ac: {} },
    ],
    packages: [
      { id: uid(), name: "Shopfront & Glazing", vendor: "Klarline Systems", lines: [

        mkPkgLine("Base package", "base", 30000, weeklyFc(s3, 30000, 0, 10, "linear")),

  // actualise past weeks on live projects
  [p1, p2].forEach((p) => {
    p.cashIn.forEach((l) => actualiseFinite(l, 0.25));
    p.packages.forEach((pkg) => pkg.lines.forEach((l) => actualiseFinite(l, 0.15)));
  });

  // ---- overheads (recurring, 12 wks history + 40 wks ahead)
  const ohStart = addW(CUR_WK, -12);
  const mkOh = (name, amt, every) => {
    const fc = {}, ac = {};
    for (let i = 0; i < 52; i += every) fc[addW(ohStart, i)] = amt;
    Object.keys(fc).forEach((k) => { if (k < CUR_WK) ac[k] = Math.round(fc[k] * jit(0.97, 1.05)); });
    return { id: uid(), name, recurring: true, fc, ac };
  };
  const overheads = [
    mkOh("Salaries & NI", 9800, 1),
    mkOh("Office rent & rates", 12400, 4),
    mkOh("Vehicles & plant", 1450, 1),
    mkOh("Insurance", 3900, 4),
    mkOh("IT, phones & subscriptions", 1750, 4),
    mkOh("Professional fees", 900, 1),
  ];

  const projects = [p1, p2, p3];
  const users = [
    { id: "u-andy", name: "Andy", role: "director", projects: projects.map((p) => p.id) },
    { id: "u-priya", name: "Priya S", role: "pm", projects: [p1.id, p3.id] },

    { id: "u-helen", name: "Helen C (test HoC)", role: "hoc", projects: projects.map((p) => p.id) },
  ];
  return {
    version: 1,
    settings: { company: "Fit-Out Co", openingBalance: 235000, openingWk: ohStart },
    users, projects, overheads,
  };
}

/* ---------------- corporate aggregation ---------------- */
const ACCESS = {
  qs:         { dashboard: "my", allProjects: false, corporate: false, profit: false, registers: false, team: false },
  pm:         { dashboard: "my", allProjects: false, corporate: false, profit: false, registers: false, team: false },
  pd:         { dashboard: "projects", allProjects: true, corporate: false, profit: false, registers: true, team: false },
  hoc:        { dashboard: "projects", allProjects: true, corporate: false, profit: false, registers: true, team: false },
  accountant: { dashboard: "corporate", allProjects: true, corporate: true, profit: false, registers: true, team: true },
  director:   { dashboard: "corporate", allProjects: true, corporate: true, profit: true, registers: true, team: true },
};
const accessOf = (role) => ACCESS[role] || ACCESS.qs;
function corporateAgg(data, curWk, includeOverheads = true) {
  const agg = {}; // wk -> {fcIn, fcOut, acIn, acOut, prIn, prOut}
  const touch = (k) => (agg[k] = agg[k] || { fcIn: 0, fcOut: 0, acIn: 0, acOut: 0, prIn: 0, prOut: 0 });
  data.projects.forEach((p) => {
    const s = projectSeries(p, curWk);
    Object.entries(s).forEach(([k, a]) => {
      const t = touch(k);
      t.fcIn += a.fcIn; t.fcOut += a.fcOut; t.acIn += a.acIn; t.acOut += a.acOut; t.prIn += a.prIn; t.prOut += a.prOut;
    });
  });
  if (includeOverheads) data.overheads.forEach((l) => {
    const { proj } = lineProj(l, curWk);
    Object.entries(l.fc || {}).forEach(([k, v]) => { touch(k).fcOut += v; });
    Object.entries(l.ac || {}).forEach(([k, v]) => { touch(k).acOut += v; });
    Object.entries(proj).forEach(([k, v]) => { touch(k).prOut += v; });
  });
  return agg;
}
function corporateCurve(data, curWk, scope = "corporate") {
  const projOnly = scope === "projects";
  const agg = corporateAgg(data, curWk, !projOnly);
  const wks = Object.keys(agg).sort();
  const open = projOnly ? 0 : data.settings.openingBalance;
  let bal = open, fbal = open, abal = open;
  return wks.map((k) => {
    const a = agg[k];
    bal += a.prIn - a.prOut; fbal += a.fcIn - a.fcOut;
    let actual = null;
    if (k <= CUR_WK) { abal += a.acIn - a.acOut; actual = abal; }
    return { wk: k, label: fmtWk(k), projected: bal, forecast: fbal, actual };
  });
}

/* ---------------- cash curve chart ---------------- */
function toMonthly(curve) {
  const byM = new Map();
  curve.forEach((p) => {
    const mk = p.wk.slice(0, 7);
    if (!byM.has(mk)) byM.set(mk, { pts: [] });
    byM.get(mk).pts.push(p);
  });
  return [...byM.entries()].map(([mk, { pts }]) => {
    const last = pts[pts.length - 1];
    let actual = null;
    for (let i = pts.length - 1; i >= 0; i--) if (pts[i].actual !== null && pts[i].actual !== undefined) { actual = pts[i].actual; break; }
    const d = new Date(mk + "-01T12:00:00");
    return { wk: last.wk, label: d.toLocaleDateString("en-GB", { month: "short", year: "2-digit" }), forecast: last.forecast, projected: last.projected, actual };
  });
}

    const startK = keys.length ? (keys[0] < projStart ? keys[0] : projStart) : projStart;
    const endK = keys.length ? keys[keys.length - 1] : addW(projStart, 12);
    const n = Math.max(wkDiff(startK, endK) + 5, 14);
    return Array.from({ length: n }, (_, i) => addW(startK, i));
  }, [fc, projStart]);
  const total = sumMap(fc);
  const applySpread = () => {

}

/* ---------------- project grid ---------------- */
function ProjectGrid({ project, onEditLine, onInvoices, onClientInvoices, range }) {
  const { inn, out } = projectLines(project);
  const agg = projectSeries(project, CUR_WK);
  let wks = Object.keys(agg).sort();
  if (range) wks = wks.filter((k) => k >= range.from && k <= range.to);
  const projCache = useMemo(() => {
    const m = {};
    [...inn, ...out].forEach((l) => { m[l.id] = lineProj(l, CUR_WK).proj; });
    return m;
  }, [project]);

  const cell = (l, k) => {
    const fc = (l.fc || {})[k], ac = (l.ac || {})[k], pj = (projCache[l.id] || {})[k];
    const past = k < CUR_WK || ac !== undefined;
    const cls = "num" + (k === CUR_WK ? " cur" : "");
    if (past) {
      const varc = ac !== undefined && fc !== undefined && Math.abs(ac - fc) > 1
        ? ((l.dir === "in" ? ac >= fc : ac <= fc) ? "pos" : "neg") : "";

        <td className={cls} key={k}>
          <span className={"acv " + varc}>{ac !== undefined ? moneyK(ac) : (fc ? <span className="neg">slip</span> : "—")}</span>

    return (
      <td className={cls} key={k}>
        <span style={{ color: "var(--blueprint)" }}>{pj ? moneyK(pj) : (fc ? moneyK(fc) : "—")}</span>
        {differs && <span className="fcsm">f {moneyK(fc)}</span>}
      </td>
    );
  };

  const lineRow = (l, indent) => (
    <tr key={l.id}>
      <td className="rowname" style={indent ? { paddingLeft: 22 } : null}>
        <span className={l.type === "variation" ? "sub" : ""}>{l.name}</span>{" "}
        <button className="btn ghost sm" style={{ padding: "1px 6px", fontSize: 10 }} onClick={() => onEditLine(l)}>fc</button>
      </td>
      <td className="num">{l.value !== undefined ? moneyK(l.value) : ""}</td>
      {wks.map((k) => cell(l, k))}
    </tr>
  );

  // group out lines by package
  const pkgGroups = project.packages.map((pkg) => ({
    pkg, lines: out.filter((l) => l.pkgId === pkg.id),

  let cumF = 0, cumP = 0;
  const totRow = (label, fn, strongZero) => (
    <tr className="tot">
      <td className="rowname">{label}</td><td className="num"></td>
      {wks.map((k) => {
        const v = fn(k);
        return <td className={"num" + (k === CUR_WK ? " cur" : "")} key={k} style={v < 0 && strongZero ? { color: "var(--red)" } : null}>{moneyK(v)}</td>;
      })}
    </tr>
  );

  const cumProjVals = {}, cumFcVals = {};
  wks.forEach((k) => {
    const a = agg[k];
    cumP += a.prIn - a.prOut; cumF += a.fcIn - a.fcOut;
    cumProjVals[k] = cumP; cumFcVals[k] = cumF;
  });

  return (
    <div>
      <div className="legend">
        <span><i style={{ background: "var(--ink)" }} />actual (bold)</span>
        <span><i style={{ background: "var(--blueprint)" }} />re-forecast</span>
        <span>f = original forecast</span>
        <span><i style={{ background: "var(--hivis-soft)", border: "1px solid var(--hivis)" }} />current week</span>
        <span className="neg">slip = forecast week passed without actual (rolls forward)</span>
      </div>
      <div className="gridwrap">
        <table className="cg">
          <thead>
            <tr>
              <th className="rowname">Line</th>
              <th className="num">Value</th>
              {wks.map((k) => <th key={k} className={"num" + (k === CUR_WK ? " cur" : "")}>{fmtWk(k)}</th>)}
            </tr>
          </thead>
          <tbody>
            <tr className="grp"><td className="rowname">Cash in
              {onClientInvoices && <button className="btn ghost sm" style={{ padding: "1px 6px", fontSize: 10, textTransform: "none", letterSpacing: 0, marginLeft: 6 }} onClick={onClientInvoices}>
                Client invoices{clientUnpaid(project) > 0 ? " · " + moneyK(clientUnpaid(project)) + " outstanding" : ""}
              </button>}
            </td><td colSpan={wks.length + 1}></td></tr>
            {inn.map((l) => lineRow(l, false))}
            {totRow("Total in", (k) => agg[k].prIn)}
            {pkgGroups.map(({ pkg, lines }) => (
              <FragmentRows key={pkg.id} pkg={pkg} lines={lines} lineRow={lineRow} wkCount={wks.length} onInvoices={onInvoices} />
            ))}
            {totRow("Total out", (k) => agg[k].prOut)}
            {totRow("Net week", (k) => agg[k].prIn - agg[k].prOut)}
            {totRow("Cumulative (projected)", (k) => cumProjVals[k], true)}
            {totRow("Cumulative (orig. forecast)", (k) => cumFcVals[k])}
          </tbody>
        </table>
      </div>
    </div>
  );
}
function FragmentRows({ pkg, lines, lineRow, wkCount, onInvoices }) {

  const recd = p.cashIn.reduce((a, l) => a + sumMap(l.ac), 0);
  const paidOut = extPkgs.reduce((a, pk) => a + pk.lines.reduce((x, l) => x + sumMap(l.ac), 0), 0);
  const invIn = clientInvoiced(p), invInPaid = (p.clientInvoices || []).filter((i) => i.status === "paid").reduce((a, i) => a + i.amount, 0);

  const invOutDue = p.packages.reduce((a, pk) => a + unpaidOf(pk), 0);

function ageBuckets(invoices) {
  const out = { b0: 0, b30: 0, b60: 0, b90: 0 };

function MarginStrip({ project, ohRate }) {

  const netCP = pcn(s.netOrig, s.head.base);

  const netLP = pcn(s.netCash, s.recd);
  const ohPct = (s.oh.rate * 100).toFixed(0);
  const drift = contractP !== null && afaP !== null ? afaP - contractP : null;
  const liveTone = liveP === null ? "" : liveP >= (afaP ?? contractP ?? 0) - 0.05 ? " good" : " bad";

            <span className="mdelta" style={{ background: drift >= 0 ? "#1F7A5C" : "#B3402E", color: "#fff" }}>{(drift >= 0 ? "+" : "") + drift.toFixed(1) + "pt"}</span>

        </div>

function cellToWk(v) {
  let d = null;
  if (v instanceof Date) d = v;
  else if (typeof v === "number" && v > 20000) d = new Date(Math.round((v - 25569) * DAY));
  else if (typeof v === "string" && v.trim()) { const t = Date.parse(v); if (!isNaN(t)) d = new Date(t); }
  return d && !isNaN(d) ? wkKey(d) : null;
}
function parseWorkbook(wb, filename) {
  // Info sheet (optional): key/value pairs
  const info = {};
  const infoWs = wb.Sheets["Info"];
  if (infoWs) XLSX.utils.sheet_to_json(infoWs, { header: 1, raw: true, defval: null }).forEach((r) => {
    if (r && r[0]) info[String(r[0]).trim().toLowerCase()] = r[1];
  });
  const ws = wb.Sheets["Cashflow"] || wb.Sheets[wb.SheetNames.find((n) => n !== "Info")];
  if (!ws) throw new Error("No 'Cashflow' sheet found.");
  const rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: null });
  const hi = rows.findIndex((r) => r && String(r[0] || "").trim().toLowerCase() === "section");
  if (hi < 0) throw new Error("Header row not found — column A must contain 'Section'.");
  const header = rows[hi];
  const weekCols = [];
  for (let c = 5; c < header.length; c++) {
    const wk = cellToWk(header[c]);
    if (wk) weekCols.push({ c, wk });
  }
  if (!weekCols.length) throw new Error("No week date columns found after column E.");
  const lines = new Map();
  let skipped = 0;
  for (let r = hi + 1; r < rows.length; r++) {
    const row = rows[r];
    if (!row || row.every((x) => x === null || x === "")) continue;
    const sec = String(row[0] || "").trim().toUpperCase();
    if (sec !== "IN" && sec !== "OUT") { skipped++; continue; }
    const pkg = String(row[1] || "").trim();
    const lineName = String(row[2] || "").trim() || (sec === "IN" ? "Contract sum" : "Base package");
    const type = String(row[3] || "").trim().toLowerCase();
    const fa = String(row[4] || "f").trim().toLowerCase();
    const key = sec + "|" + pkg + "|" + lineName;
    if (!lines.has(key)) lines.set(key, { sec, pkg, lineName, type, fc: {}, ac: {} });
    const L = lines.get(key);
    const map = fa.startsWith("a") ? L.ac : L.fc;
    weekCols.forEach(({ c, wk }) => {
      const v = row[c];
      if (v === null || v === "") return;
      const n = Number(v);
      if (isNaN(n)) return;
      if (!fa.startsWith("a") && n === 0) return; // blank forecast; explicit 0 actual = slipped week, keep it
      map[wk] = (map[wk] || 0) + n;
    });
  }
  if (!lines.size) throw new Error("No IN/OUT data rows found.");
  const cashIn = [];
  const pkgMap = new Map();
  lines.forEach((L) => {
    const item = {
      id: uid(), name: L.lineName,
      type: L.sec === "IN" ? (L.type.startsWith("v") ? "variation" : "contract") : (L.type.startsWith("v") ? "variation" : "base"),
      value: Math.round(sumMap(L.fc)), fc: L.fc, ac: L.ac,
    };
    if (L.sec === "IN") cashIn.push(item);
    else {
      const pname = L.pkg || "General";
      if (!pkgMap.has(pname)) pkgMap.set(pname, { id: uid(), name: pname, vendor: pname, lines: [] });
      pkgMap.get(pname).lines.push(item);
    }
  });
  const allWks = weekCols.map((w) => w.wk).sort();
  const start = cellToWk(info["start"]) || allWks[0];
  const weeks = Math.max(Number(info["weeks"]) || 0, wkDiff(start, allWks[allWks.length - 1]) + 1, 1);
  return {
    project: {
      id: uid(),
      code: String(info["code"] || "").trim() || "P-" + String(Date.now()).slice(-4),
      name: String(info["name"] || "").trim() || filename.replace(/\.(xlsx?|csv)$/i, ""),
      client: String(info["client"] || "").trim() || "—",
      start, weeks, cashIn, packages: [...pkgMap.values()],
    },
    stats: { lines: lines.size, weeks: weekCols.length, skipped,
      totalIn: cashIn.reduce((a, l) => a + sumMap(l.fc), 0),
      totalOut: [...pkgMap.values()].reduce((a, p) => a + p.lines.reduce((b, l) => b + sumMap(l.fc), 0), 0) },
  };
}

function ExcelImport({ projects, onImport, onClose }) {
  const [preview, setPreview] = useState(null);
  const [err, setErr] = useState(null);
  const [busy, setBusy] = useState(false);
  const pick = async (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    setBusy(true); setErr(null); setPreview(null);
    try {
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, { type: "array", cellDates: true });
      setPreview(parseWorkbook(wb, file.name));
    } catch (ex) { setErr(String(ex.message || ex)); }
    setBusy(false);
  };
  const match = preview && projects.find((p) => p.code.toLowerCase() === preview.project.code.toLowerCase());
  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={(e) => e.stopPropagation()}>
        <h2>Import from Excel</h2>
        <div className="sub" style={{ marginBottom: 10 }}>
          One workbook per project. Sheet "Cashflow": columns Section (IN/OUT) · Package · Line · Type (contract/base/variation) · F/A (Forecast/Actual), then one column per week headed with its date. Optional "Info" sheet: Code, Name, Client, Start, Weeks. Leave an actual blank if unknown; enter 0 for a week that slipped.
        </div>
        <div style={{ display: "flex", gap: 8, marginBottom: 12, flexWrap: "wrap" }}>
          <button className="btn" onClick={downloadTemplate}>Download template</button>
          <label className="btn amber" style={{ cursor: "pointer" }}>
            Choose file<input type="file" accept=".xlsx,.xls" style={{ display: "none" }} onChange={pick} />
          </label>
        </div>
        {busy && <div className="sub">Reading workbook…</div>}
        {err && <div style={{ color: "var(--red)", fontFamily: "var(--mono)", fontSize: 12, marginBottom: 10 }}>{err}</div>}
        {preview && (
          <div className="panel" style={{ marginBottom: 12 }}>
            <b>{preview.project.code} — {preview.project.name}</b>
            <div className="sub">{preview.project.client} · starts w/c {fmtWk(preview.project.start)} · {preview.project.weeks} weeks</div>
            <div style={{ fontFamily: "var(--mono)", fontSize: 12, marginTop: 6 }}>
              {preview.stats.lines} lines · {preview.stats.weeks} week columns · in {moneyK(preview.stats.totalIn)} · out {moneyK(preview.stats.totalOut)}
              {preview.stats.skipped > 0 && <span style={{ color: "var(--hivis)" }}> · {preview.stats.skipped} rows skipped (no IN/OUT)</span>}
            </div>
            <div style={{ display: "flex", gap: 8, marginTop: 10, flexWrap: "wrap" }}>
              {match && <button className="btn amber" onClick={() => { onImport(preview.project, match.id); onClose(); }}>Replace {match.code}</button>}
              <button className="btn" onClick={() => { onImport(preview.project, null); onClose(); }}>Create as new project</button>
            </div>
            {match && <div className="sub" style={{ marginTop: 6 }}>A project with code {match.code} already exists — "Replace" overwrites its sheet with this workbook.</div>}
          </div>
        )}
        <button className="btn ghost" onClick={onClose}>Close</button>
      </div>
    </div>
  );
}

function OhWeekUpdate({ overheads, onSave, onClose }) {
  const wks = useMemo(() => {
    const s = new Set();
    overheads.forEach((l) => Object.keys(l.fc || {}).concat(Object.keys(l.ac || {})).forEach((k) => s.add(k)));
    return [...s].sort();
  }, [overheads]);
  const defWk = wks.filter((k) => k <= CUR_WK).pop() || wks[0];
  const [wkSel, setWkSel] = useState(defWk);
  const [vals, setVals] = useState({});
  useEffect(() => {
    const v = {};
    overheads.forEach((l) => { v[l.id] = l.ac && l.ac[wkSel] !== undefined ? String(l.ac[wkSel]) : ""; });
    setVals(v);
  }, [wkSel, overheads]);
  return (
    <Modal title="Record overhead actuals" onClose={onClose}>
      <div className="frow">
        <Field label="Week commencing">
          <select value={wkSel} onChange={(e) => setWkSel(e.target.value)}>
            {wks.map((k) => <option key={k} value={k}>{fmtWk(k)}{k === CUR_WK ? " (this week)" : ""}</option>)}
          </select>
        </Field>
      </div>
      {overheads.map((l) => (
        <div className="uline" key={l.id}>
          <div className="nm"><b>{l.name}</b><span>forecast {money((l.fc || {})[wkSel] || 0)}</span></div>
          <input inputMode="decimal" placeholder="—" value={vals[l.id] ?? ""} onChange={(e) => setVals({ ...vals, [l.id]: e.target.value })} />
        </div>
      ))}
      <div className="mfoot">
        <button className="btn ghost" onClick={onClose}>Cancel</button>
        <button className="btn amber" onClick={() => onSave(wkSel, vals)}>Save actuals</button>
      </div>
    </Modal>
  );
}

function Dashboard({ data, projects, openProject, scope }) {
  const projOnly = scope !== "corporate";
  const scoped = projOnly ? { ...data, projects } : data;
  const curve = corporateCurve(scoped, CUR_WK, projOnly ? "projects" : "corporate");
  const nowPt = [...curve].reverse().find((c) => c.wk <= CUR_WK) || curve[0];
  const at = (n) => { const k = addW(CUR_WK, n); const pt = [...curve].reverse().find((c) => c.wk <= k); return pt ? pt.projected : nowPt?.projected || 0; };
  const [hz, setHz] = useState(13);
  const [gran, setGran] = useState("w");
  const HZS = [[4, "1 mo"], [13, "3 mo"], [26, "6 mo"], [52, "12 mo"]];
  const hzLabel = HZS.find(([w]) => w === hz)[1];
  const win = curve.filter((c) => c.wk >= CUR_WK && c.wk <= addW(CUR_WK, hz));
  const trough = win.reduce((m, p) => Math.min(m, p.projected), Infinity);
  const troughPt = win.find((p) => p.projected === trough);
  const winFrom = addW(CUR_WK, -8), winTo = addW(CUR_WK, hz);

  // variance alerts: project lines materially off plan to date
  const alerts = [];
  projects.forEach((p) => {
    projectLines(p).all.forEach((l) => {
      let fcTD = 0, acTD = 0;
      Object.entries(l.fc || {}).forEach(([k, v]) => { if (k < CUR_WK) fcTD += v; });
      Object.entries(l.ac || {}).forEach(([k, v]) => { if (k < CUR_WK) acTD += v; });
      const dv = acTD - fcTD;
      const material = Math.abs(dv) > Math.max(10000, 0.1 * (l.value || 0));
      if (material && fcTD > 0) alerts.push({ p, l, dv });
    });
  });
  alerts.sort((a, b) => Math.abs(b.dv) - Math.abs(a.dv));

  return (
    <div>
      <div className="pagehead">
        <div><h1>{scope === "my" ? "My projects" : projOnly ? "Projects roll-up" : "Cash position"}</h1><div className="sub">{data.settings.company} · w/c {fmtWk(CUR_WK)}{scope === "my" ? " · your assigned projects only" : projOnly ? " · all projects, excl. corporate overheads & bank" : ""}</div></div>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
          <GranSeg gran={gran} setGran={setGran} />
          <div className="seg">{HZS.map(([w, l]) => <button key={w} className={hz === w ? "on" : ""} onClick={() => setHz(w)}>{l}</button>)}</div>
        </div>
      </div>
      <div className="cards">
        <div className="card"><div className="k">{scope === "my" ? "My projects net to date" : projOnly ? "Projects net to date" : "Cash today"}</div><div className={"v " + ((nowPt?.projected || 0) >= 0 ? "pos" : "neg")}>{money(nowPt?.projected)}</div><div className="d">{projOnly ? "cash in − cash out, all projects" : "opening + actuals to date"}</div></div>
        <div className="card"><div className="k">Invoiced, awaiting receipt</div><div className="v pos">{money(projects.reduce((a, p) => a + clientUnpaid(p), 0))}</div><div className="d">{(() => { const b = projects.reduce((a, p) => addBuckets(a, ageBuckets(p.clientInvoices)), { ...ZERO_B }); return <>30/60/90+: {moneyK(b.b30)} / {moneyK(b.b60)} / <span style={{ color: b.b90 > 0 ? "var(--red)" : undefined }}>{moneyK(b.b90)}</span></>; })()}</div></div>
        <div className="card"><div className="k">Invoiced, awaiting payment</div><div className="v warn">{money(projects.reduce((a, p) => a + projectUnpaid(p), 0))}</div><div className="d">{(() => { const b = projects.reduce((a, p) => addBuckets(a, p.packages.reduce((x, pk) => addBuckets(x, ageBuckets(pk.invoices)), { ...ZERO_B })), { ...ZERO_B }); return <>30/60/90+: {moneyK(b.b30)} / {moneyK(b.b60)} / <span style={{ color: b.b90 > 0 ? "var(--red)" : undefined }}>{moneyK(b.b90)}</span></>; })()}</div></div>
        <div className="card"><div className="k">In {hzLabel}</div><div className={"v " + (at(hz) >= 0 ? "" : "neg")}>{money(at(hz))}</div><div className="d">projected</div></div>
        <div className="card"><div className="k">{hzLabel} trough</div><div className={"v " + (trough >= 0 ? "pos" : "neg")}>{trough === Infinity ? "—" : money(trough)}</div><div className="d">{troughPt ? "w/c " + troughPt.label : ""}</div></div>
      </div>
      <div className="panel">
        <h2>{scope === "my" ? "My projects net position" : projOnly ? "Projects net position" : "Bank position"} — next {hzLabel} (+8 wks history)</h2>
        <CashChart curve={(gran === "m" ? toMonthly : (x) => x)(curve.filter((c) => c.wk >= winFrom && c.wk <= winTo))} zeroLine height={260} />
        <ChartLegend />
      </div>
      <div className="panel" style={{ padding: 0 }}>
        <h2 style={{ padding: "14px 16px 0" }}>Projects</h2>
        <table className="tbl">
          <thead><tr><th>Project</th><th className="mono">Value in</th><th className="mono">Proj. final</th><th>Vs plan</th></tr></thead>
          <tbody>
            {projects.map((p) => {
              const c = seriesToCurve(projectSeries(p, CUR_WK));
              const fin = c.length ? c[c.length - 1] : { forecast: 0, projected: 0 };
              const totalIn = p.cashIn.reduce((a, l) => a + (l.value || 0), 0);
              return (
                <tr key={p.id} className="click" onClick={() => openProject(p.id)}>
                  <td>{p.code} — {p.name}</td>
                  <td className="mono">{moneyK(totalIn)}</td>
                  <td className="mono">{moneyK(fin.projected)}</td>
                  <td><VarBadge v={fin.projected - fin.forecast} /></td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
      {alerts.length > 0 && (
        <div className="panel" style={{ padding: 0 }}>
          <h2 style={{ padding: "14px 16px 0" }}>Variance watch — lines off plan to date</h2>
          <table className="tbl">
            <thead><tr><th>Project</th><th>Line</th><th>To-date variance</th></tr></thead>
            <tbody>
              {alerts.slice(0, 8).map(({ p, l, dv }, i) => (
                <tr key={i} className="click" onClick={() => openProject(p.id)}>
                  <td className="mono">{p.code}</td>
                  <td>{l.group !== "Cash in" ? l.group + " — " : "Cash in — "}{l.name}</td>
                  <td><VarBadge v={dv} invert={l.dir === "out"} /></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

function buildProjectIntoData(d, form, createdBy) {
  // resolve client
  let cid = form.clientId;
  if (cid === "__new") {
    const nm = form.clientName.trim();
    const ex = d.clients.find((c) => c.name.toLowerCase() === nm.toLowerCase());
    if (ex) cid = ex.id; else { const c = { id: uid(), name: nm, notes: "" }; d.clients.push(c); cid = c.id; }
  }
  const client = d.clients.find((c) => c.id === cid);
  const start = wkKey(new Date(form.start + "T12:00:00"));
  const weeks = Math.max(1, Number(form.weeks) || 12);
  const project = {
    id: uid(), code: form.code, name: form.name, client: client ? client.name : "—", clientId: cid,
    start, weeks, stage: form.stage || "contract", clientInvoices: [],
    cashIn: [{ id: uid(), name: "Contract sum", type: "contract", value: num(form.value), fc: cycleFc(start, num(form.value), weeks, "scurve", 6, 4), ac: {} }],
    packages: [],
  };
  (form.packages || []).forEach((pk) => {
    if (!pk.name || !num(pk.value)) return;
    let vid = pk.vendorId;
    if (vid === "__new") {
      const nm = pk.vendorName.trim();
      const ex = d.vendors.find((v) => v.name.toLowerCase() === nm.toLowerCase());
      if (ex) vid = ex.id; else { const v = { id: uid(), name: nm, type: pk.vendorType || "subcontractor", trades: [pk.name], notes: "" }; d.vendors.push(v); vid = v.id; }
    }
    const v = d.vendors.find((x) => x.id === vid);
    if (v && !v.trades.includes(pk.name)) v.trades.push(pk.name);
    project.packages.push({
      id: uid(), name: pk.name, vendorId: vid, vendor: v ? v.name : "", stage: pk.stage || "subcontract", invoices: [],
      lines: [{ id: uid(), name: "Base package", type: "base", value: num(pk.value), fc: cycleFc(start, num(pk.value), Math.max(1, weeks - 2), "scurve", 7, 4), ac: {} }],
    });
  });
  d.projects.push(project);
  const creator = d.users.find((u) => u.id === createdBy);
  if (creator && !isMgmtRole(creator.role) && !creator.projects.includes(project.id)) creator.projects.push(project.id);
  d.users.forEach((u) => { if (isMgmtRole(u.role) && !u.projects.includes(project.id)) u.projects.push(project.id); });
  return project;
}
function applyApproval(d, ap) {
  if (ap.type === "project") buildProjectIntoData(d, ap.payload.form, ap.createdBy);
  if (ap.type === "actuals") {
    const p = d.projects.find((x) => x.id === ap.payload.projectId);
    if (!p) return;
    const applyTo = (l) => {
      const raw = ap.payload.vals[l.id];
      if (raw === undefined) return;
      l.ac = l.ac || {};
      if (raw === "") delete l.ac[ap.payload.wk];
      else l.ac[ap.payload.wk] = num(raw);
    };
    p.cashIn.forEach(applyTo);
    p.packages.forEach((pk) => pk.lines.forEach(applyTo));
  }
}
function makeApproval(d, type, createdBy, payload, summary) {
  const creator = d.users.find((u) => u.id === createdBy);
  const startIdx = CHAIN.indexOf(creator ? creator.role : "qs") + 1; // qs -> 0 (full chain: PM→PD→Accountant→HoC→Director); pm -> from PD; etc.
  const steps = CHAIN.slice(startIdx)
    .filter((role) => d.users.some((u) => u.role === role))
    .map((role) => ({ role, label: ROLE_LABEL[role], status: "pending", userId: null, name: null, at: null }));
  if (!steps.length) return null; // nothing above creator — apply directly
  return { id: uid(), type, createdBy, createdByName: creator ? creator.name : "?", createdAt: new Date().toISOString(), status: "pending", steps, payload, summary };
}
function currentStep(ap) { return (ap.steps || []).find((s) => s.status === "pending"); }
const PTYPES = [["allocation", "Profit allocation (in)"], ["bonus", "Bonus payout"], ["dividend", "Shareholder dividend"]];
function ProfitPanel({ data, setData }) {
  const [f, setF] = useState({ date: new Date().toISOString().slice(0, 10), type: "allocation", label: "", amount: "" });
  const set = (k) => (e) => setF({ ...f, [k]: e.target.value });
  const entries = [...data.profit.entries].sort((a, b) => (a.date < b.date ? 1 : -1));

  const paidOut = entries.filter((e) => e.type !== "allocation").reduce((a, e) => a + e.amount, 0);

function downloadOhTemplate() {
  const wb = XLSX.utils.book_new();
  const months = [];
  const yr = new Date().getFullYear(); // full calendar year, Jan–Dec
  for (let m = 0; m < 12; m++) months.push(new Date(yr, m, 1, 12));
  const rows = [["Line", "F/A", ...months]];
  OH_CATEGORIES.forEach((c) => { rows.push([c, "Forecast"]); rows.push([c, "Actual"]); });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows), "Overheads");
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([
    ["Two rows per line: Forecast (projections) and Actual (historicals)."],
    ["Column headers are payment dates — amounts land in the week containing the date. Monthly or weekly columns both work."],
    ["Blank = unknown. 0 in Actual = confirmed nothing paid. Add lines/columns freely."],
  ]), "Info");
  XLSX.writeFile(wb, "northflow-corporate-oh-template.xlsx", { cellDates: true });
}
function OhImport({ data, setData, onClose }) {
  const [preview, setPreview] = useState(null);
  const [err, setErr] = useState(null);
  const pick = async (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    setErr(null); setPreview(null);
    try {
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, { type: "array", cellDates: true });
      const ws = wb.Sheets["Overheads"] || wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: null });
      const hi = rows.findIndex((r) => r && String(r[0] || "").trim().toLowerCase() === "line");
      if (hi < 0) throw new Error("Header row not found — column A must be 'Line'.");
      const weekCols = [];
      for (let c = 2; c < rows[hi].length; c++) { const wk = cellToWk(rows[hi][c]); if (wk) weekCols.push({ c, wk }); }
      if (!weekCols.length) throw new Error("No date columns found after column B.");
      const lines = new Map();
      for (let r = hi + 1; r < rows.length; r++) {
        const row = rows[r];
        if (!row || !row[0]) continue;
        const name = String(row[0]).trim();
        const fa = String(row[1] || "f").trim().toLowerCase();
        if (!lines.has(name.toLowerCase())) lines.set(name.toLowerCase(), { name, fc: {}, ac: {} });
        const L = lines.get(name.toLowerCase());
        const map = fa.startsWith("a") ? L.ac : L.fc;
        weekCols.forEach(({ c, wk }) => {
          const v = row[c];
          if (v === null || v === "") return;
          const n = Number(v);
          if (isNaN(n)) return;
          if (!fa.startsWith("a") && n === 0) return;
          map[wk] = (map[wk] || 0) + n;
        });
      }
      if (!lines.size) throw new Error("No overhead lines found.");
      const arr = [...lines.values()];
      const existing = arr.filter((l) => data.overheads.some((o) => o.name.toLowerCase() === l.name.toLowerCase())).length;
      const fcT = arr.reduce((a, l) => a + sumMap(l.fc), 0), acT = arr.reduce((a, l) => a + sumMap(l.ac), 0);
      setPreview({ arr, existing, added: arr.length - existing, weeks: weekCols.length, fcT, acT });
    } catch (ex) { setErr(String(ex.message || ex)); }
  };
  const doImport = () => {
    const d = JSON.parse(JSON.stringify(data));
    preview.arr.forEach((l) => {
      const ex = d.overheads.find((o) => o.name.toLowerCase() === l.name.toLowerCase());
      if (ex) { Object.assign(ex.fc = ex.fc || {}, l.fc); Object.assign(ex.ac = ex.ac || {}, l.ac); }
      else d.overheads.push({ id: uid(), name: l.name, fc: l.fc, ac: l.ac });
    });
    setData(d); onClose();
  };
  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={(e) => e.stopPropagation()}>
        <h2>Import overheads</h2>
        <div className="sub" style={{ marginBottom: 10 }}>
          Sheet "Overheads": Line · F/A (Forecast/Actual) · date columns (monthly or weekly — amounts land in the week containing each date). Historical actuals + future forecasts in one file. Provided weeks overwrite the same weeks in the app; other weeks are untouched; nothing is deleted.
        </div>
        <div style={{ display: "flex", gap: 8, marginBottom: 12, flexWrap: "wrap" }}>
          <button className="btn" onClick={downloadOhTemplate}>Download template</button>
          <label className="btn amber" style={{ cursor: "pointer" }}>
            Choose file<input type="file" accept=".xlsx,.xls,.csv" style={{ display: "none" }} onChange={pick} />
          </label>
        </div>
        {err && <div style={{ color: "var(--red)", fontFamily: "var(--mono)", fontSize: 12, marginBottom: 10 }}>{err}</div>}
        {preview && (
          <div className="panel" style={{ marginBottom: 12 }}>
            <div style={{ fontFamily: "var(--mono)", fontSize: 13 }}>
              {preview.arr.length} lines ({preview.added} new · {preview.existing} updated) · {preview.weeks} date columns<br />
              Forecast total {moneyK(preview.fcT)} · Actuals total {moneyK(preview.acT)}
            </div>
            <button className="btn amber" style={{ marginTop: 10 }} onClick={doImport}>Import</button>
          </div>
        )}
        <button className="btn ghost" onClick={onClose}>Close</button>
      </div>
    </div>
  );
}

function parseRegisterRows(ws) {
  const rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: null });
  const hi = rows.findIndex((r) => r && String(r[0] || "").trim().toLowerCase() === "name");
  if (hi < 0) return [];
  return rows.slice(hi + 1).filter((r) => r && String(r[0] || "").trim()).map((r) => ({
    name: String(r[0]).trim(),
    col2: r[1] === null ? "" : String(r[1]).trim(),
    col3: r[2] === null ? "" : String(r[2]).trim(),
    col4: r[3] === null ? "" : String(r[3]).trim(),
  }));
}
function RegisterImport({ data, setData, onClose, defaultKind }) {
  const [preview, setPreview] = useState(null);
  const [err, setErr] = useState(null);
  const pick = async (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    setErr(null); setPreview(null);
    try {
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, { type: "array" });
      let vRows = wb.Sheets["Vendors"] ? parseRegisterRows(wb.Sheets["Vendors"]) : [];
      let cRows = wb.Sheets["Clients"] ? parseRegisterRows(wb.Sheets["Clients"]) : [];
      if (!wb.Sheets["Vendors"] && !wb.Sheets["Clients"]) {
        const first = parseRegisterRows(wb.Sheets[wb.SheetNames[0]]);
        if (defaultKind === "vendors") vRows = first; else cRows = first;
      }
      if (!vRows.length && !cRows.length) throw new Error("No rows found. Column A must be 'Name' with entries below (sheets named Vendors / Clients, or a single sheet).");
      const norm = (s) => s.toLowerCase();
      const vTypes = ["subcontractor", "supplier", "subconsultant"];
      const vendors = vRows.map((r) => {
        const existing = data.vendors.find((v) => norm(v.name) === norm(r.name));
        return { name: r.name, type: vTypes.includes(norm(r.col2)) ? norm(r.col2) : "subcontractor",
          trades: r.col3 ? r.col3.split(",").map((t) => t.trim()).filter(Boolean) : [], notes: r.col4, existing };
      });
      const clients = cRows.map((r) => {
        const existing = data.clients.find((c) => norm(c.name) === norm(r.name));
        return { name: r.name, notes: r.col2, existing };
      });
      setPreview({ vendors, clients });
    } catch (ex) { setErr(String(ex.message || ex)); }
  };
  const doImport = () => {
    const d = JSON.parse(JSON.stringify(data));
    preview.vendors.forEach((r) => {
      const ex = d.vendors.find((v) => v.name.toLowerCase() === r.name.toLowerCase());
      if (ex) { ex.type = r.type; if (r.notes) ex.notes = r.notes; r.trades.forEach((t) => { if (!ex.trades.includes(t)) ex.trades.push(t); }); }
      else d.vendors.push({ id: uid(), name: r.name, type: r.type, trades: r.trades, notes: r.notes });
    });
    preview.clients.forEach((r) => {
      const ex = d.clients.find((c) => c.name.toLowerCase() === r.name.toLowerCase());
      if (ex) { if (r.notes) ex.notes = r.notes; }
      else d.clients.push({ id: uid(), name: r.name, notes: r.notes });
    });
    setData(d); onClose();
  };
  const count = (list, isNew) => list.filter((r) => (isNew ? !r.existing : r.existing)).length;
  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={(e) => e.stopPropagation()}>
        <h2>Bulk upload — vendors & clients</h2>
        <div className="sub" style={{ marginBottom: 10 }}>
          One workbook, sheets named "Vendors" (Name · Type · Packages · Notes) and/or "Clients" (Name · Notes). Existing names are updated and their package lists merged — nothing is deleted.
        </div>
        <div style={{ display: "flex", gap: 8, marginBottom: 12, flexWrap: "wrap" }}>
          <button className="btn" onClick={downloadRegisterTemplate}>Download template</button>
          <label className="btn amber" style={{ cursor: "pointer" }}>
            Choose file<input type="file" accept=".xlsx,.xls,.csv" style={{ display: "none" }} onChange={pick} />
          </label>
        </div>
        {err && <div style={{ color: "var(--red)", fontFamily: "var(--mono)", fontSize: 12, marginBottom: 10 }}>{err}</div>}
        {preview && (
          <div className="panel" style={{ marginBottom: 12 }}>
            <div style={{ fontFamily: "var(--mono)", fontSize: 13 }}>
              Vendors: {count(preview.vendors, true)} new · {count(preview.vendors, false)} updated<br />
              Clients: {count(preview.clients, true)} new · {count(preview.clients, false)} updated
            </div>
            <button className="btn amber" style={{ marginTop: 10 }} onClick={doImport}>Import</button>
          </div>
        )}
        <button className="btn ghost" onClick={onClose}>Close</button>
      </div>
    </div>
  );

  const mine = data.approvals.filter((a) => a.status === "pending" && currentStep(a) && currentStep(a).role === me.role && a.createdBy !== me.id);

  const decide = (apId, verdict) => {
    const d = JSON.parse(JSON.stringify(data));
    const ap = d.approvals.find((a) => a.id === apId);

    if (!step || step.role !== me.role) return;
    step.status = verdict; step.userId = me.id; step.name = me.name; step.at = new Date().toISOString();
    if (verdict === "rejected") ap.status = "rejected";
    else if (ap.steps.every((s) => s.status === "approved")) { ap.status = "approved"; applyApproval(d, ap); }
    setData(d);

  const Summary = ({ ap }) => (

/* ---------------- sign in ---------------- */
async function sha256(text) {
  if (window.crypto && window.crypto.subtle) {
    const buf = await window.crypto.subtle.digest("SHA-256", new TextEncoder().encode("nf·" + text));
    return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, "0")).join("");
  }
  let h = 5381; const s = "nf·" + text;
  for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0;
  return "djb" + (h >>> 0).toString(16);
}
function SignIn({ users, onAuth, setPassword, loginRequired }) {
  const [picked, setPicked] = useState(null);
  const [pw, setPw] = useState("");
  const [pw2, setPw2] = useState("");
  const [err, setErr] = useState(null);
  const [busy, setBusy] = useState(false);
  const u = users.find((x) => x.id === picked);
  const firstTime = u && !u.pw;
  const go = async () => {
    setBusy(true); setErr(null);
    if (firstTime) {
      if (pw.length < 4) { setErr("Password must be at least 4 characters."); setBusy(false); return; }
      if (pw !== pw2) { setErr("Passwords don't match."); setBusy(false); return; }
      const hash = await sha256(pw);
      setPassword(u.id, hash);
      onAuth(u.id);
    } else {
      const hash = await sha256(pw);
      if (hash === u.pw) onAuth(u.id);
      else setErr("Wrong password. If you've forgotten it, ask an administrator to reset it in Team & access.");
    }
    setBusy(false);
  };
  return (
    <div className="gate">
      <div className="gatecard">
        <div className="logo"><img src={NF_MARK} alt="" />North<span>Flow</span></div>
        <div style={{ fontFamily: "var(--mono)", fontSize: 11, color: "var(--ink2)", marginBottom: 14 }}>project & corporate cashflow · v{APP_VERSION}</div>
        {!u && users.map((x) => (
          <button className="userbtn" key={x.id} onClick={() => { if (!loginRequired) { onAuth(x.id); return; } setPicked(x.id); setErr(null); setPw(""); setPw2(""); }}>
            <span>{x.name}</span>
            <span className={"badge " + (isMgmtRole(x.role) ? "a" : "b")}>{ROLE_LABEL[x.role] || x.role}</span>
          </button>
        ))}
        {u && (
          <div>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
              <b>{u.name}</b>
              <button className="btn ghost sm" onClick={() => setPicked(null)}>Not you?</button>
            </div>
            {firstTime && <p className="note" style={{ marginTop: 0, marginBottom: 10 }}>First sign-in — set your password.</p>}
            <div className="frow"><Field label={firstTime ? "New password" : "Password"}>
              <input type="password" value={pw} onChange={(e) => setPw(e.target.value)} onKeyDown={(e) => e.key === "Enter" && !firstTime && go()} autoFocus />
            </Field></div>
            {firstTime && <div className="frow"><Field label="Repeat password">
              <input type="password" value={pw2} onChange={(e) => setPw2(e.target.value)} onKeyDown={(e) => e.key === "Enter" && go()} />
            </Field></div>}
            {err && <div style={{ color: "var(--red)", fontSize: 12, marginBottom: 8 }}>{err}</div>}
            <button className="btn amber" style={{ width: "100%" }} disabled={busy || !pw} onClick={go}>{firstTime ? "Set password & sign in" : "Sign in"}</button>
          </div>
        )}
        <p className="note">{loginRequired ? "Your sign-in determines what you can see — tabs and data outside your designation aren't shown." : "Passwords are currently off (pre-go-live). Pick a profile to enter — turn passwords on in Team & access when you go live."}</p>
      </div>
    </div>
  );
}

  const [memMode, setMemMode] = useState(false);
  const [userId, setUserId] = useState(null);
  const [tab, setTab] = useState("dashboard");
  const [projectId, setProjectId] = useState(null);

  const load = async () => {
    setLoadErr(null);
    const hasApi = typeof window !== "undefined" && window.storage && typeof window.storage.get === "function";
    if (!hasApi) { setMemMode(true); setDataState(ensureVendors(seedData())); return; }
    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
    let lastErr = null;
    for (let i = 0; i < 3; i++) {
      try {
        const r = await window.storage.get(STORE_KEY, true);
        setDataState(ensureVendors(JSON.parse(r.value)));
        return;
      } catch (e) { lastErr = e; if (i < 2) await sleep(600 * (i + 1)); }
    }
    // get failed 3x — either storage is down, or the key doesn't exist yet.
    // Probe storage health; only seed if storage is up (key genuinely absent).
    try {
      await window.storage.set("flowline:probe", String(Date.now()), true);
      try {
        const r = await window.storage.get(STORE_KEY, true);
        setDataState(ensureVendors(JSON.parse(r.value)));
      } catch (e) {
        const fresh = ensureVendors(seedData());
        await window.storage.set(STORE_KEY, JSON.stringify(fresh), true);
        setDataState(fresh);
      }
    } catch (e2) { setLoadErr(String((e2 && e2.message) || lastErr && lastErr.message || "unknown storage error")); }
  };
  useEffect(() => { load(); }, []);
  useEffect(() => {
    if (!data || userId || memMode || !window.storage) return;
    if (data.settings.loginRequired) return;
    window.storage.get("northflow:me", false).then((r) => {
      const id = r && r.value;
      if (id && data.users.some((u) => u.id === id)) setUserId(id);
    }).catch(() => {});
  }, [data]);

  const setData = (next) => {
    setDataState(next);
    if (!memMode && window.storage) window.storage.set(STORE_KEY, JSON.stringify(next), true).catch(() => {});
  };
  const saveProject = (p2) => {
    setData({ ...data, projects: data.projects.map((p) => (p.id === p2.id ? p2 : p)) });
  };
  const mutate = (fn) => { const d = JSON.parse(JSON.stringify(data)); fn(d); setData(d); };

  if (loadErr) return (
    <div className="fl" style={{ padding: 30 }}>
      <style>{CSS}</style>
      <div style={{ marginBottom: 8 }}>Couldn't reach storage. Saved data is untouched — retry, or continue without saving to look around.</div>
      <div style={{ marginBottom: 14, fontFamily: "monospace", fontSize: 11, opacity: 0.6 }}>Detail: {loadErr}</div>
      <button className="btn" onClick={load} style={{ marginRight: 10 }}>Retry</button>
      <button className="btn" onClick={() => { setLoadErr(null); setMemMode(true); setDataState(ensureVendors(seedData())); }}>Continue without saving</button>
    </div>
  );
  if (!data) return <div className="fl" style={{ padding: 30, fontFamily: "monospace" }}><style>{CSS}</style>Loading cashflows…</div>;

  const user = data.users.find((u) => u.id === userId);
  if (!user) return <div className="fl"><style>{CSS}</style><SignIn users={data.users}
    loginRequired={!!data.settings.loginRequired}
    setPassword={(id, hash) => setData({ ...data, users: data.users.map((u) => (u.id === id ? { ...u, pw: hash } : u)) })}
    onAuth={(id) => { setUserId(id); setTab("dashboard"); setProjectId(null); if (!memMode && window.storage && !data.settings.loginRequired) window.storage.set("northflow:me", id, false).catch(() => {}); }} /></div>;

  const isMgmt = isMgmtRole(user.role);
  const acc = accessOf(user.role);
  const myProjects = data.projects.filter((p) => acc.allProjects || user.projects.includes(p.id));
  const openProject = (id) => { setProjectId(id); setTab("project"); };
  const activeProject = data.projects.find((p) => p.id === projectId);
  const canSeeActive = activeProject && (acc.allProjects || user.projects.includes(activeProject.id));

  const NavBtn = ({ id, label }) => (
    <button className={tab === id || (id === "projects" && tab === "project") ? "on" : ""} onClick={() => { setTab(id); if (id !== "project") setProjectId(null); }}>{label}</button>
  );

  return (
    <div className="fl">
      <style>{CSS}</style>
      {memMode && <div style={{ background: "#B34A2E", color: "#fff", padding: "8px 14px", fontFamily: "var(--mono)", fontSize: 12 }}>Working without saving — storage is unreachable, changes will be lost when you close.</div>}
      <div className="shell">
        <div className="side">
          <div className="logo"><img src={NF_MARK} alt="" />North<span>Flow</span></div>
          <div className="logo-sub">{data.settings.company} · cash control</div>
          <div className="nav">
            <NavBtn id="dashboard" label="Dashboard" />
            {acc.corporate && <NavBtn id="corporate" label="Corporate" />}
            <NavBtn id="projects" label="Projects" />
            <NavBtn id="approvals" label={"Approvals" + ((n) => (n ? " (" + n + ")" : ""))(data.approvals.filter((a) => a.status === "pending" && currentStep(a) && currentStep(a).role === user.role && a.createdBy !== user.id).length)} />
            {acc.registers && <NavBtn id="clients" label="Clients" />}
            {acc.registers && <NavBtn id="vendors" label="Vendors" />}
            {acc.team && <NavBtn id="users" label="Team & access" />}
          </div>
          <div className="side-foot">
            <b>{user.name}</b>{ROLE_LABEL[user.role] || user.role}
            <div><button onClick={() => { setUserId(null); if (!memMode && window.storage) window.storage.delete("northflow:me", false).catch(() => {}); }}>Switch user</button></div>
            <div style={{ marginTop: 8, fontFamily: "var(--mono)", fontSize: 10 }}>v{APP_VERSION} · w/c {fmtWk(CUR_WK)}</div>
          </div>
        </div>
        <div className="main">
          {tab === "dashboard" && acc.dashboard && <Dashboard data={data} projects={myProjects} openProject={openProject} scope={acc.dashboard} />}
          {tab === "projects" && (
            <ProjectsList projects={myProjects} users={data.users} openProject={openProject} canCreate={true} canImport={acc.allProjects} data={data} isMgmt={isMgmt} role={user.role}
              onWizardSubmit={(form) => {
                const d = JSON.parse(JSON.stringify(data));
                const ap = makeApproval(d, "project", user.id, { form }, form.code + " " + form.name + " (" + money(num(form.value)) + ")");
                if (ap) d.approvals.push(ap); else buildProjectIntoData(d, form, user.id);
                setData(d);
              }}
              onCreate={(p) => { setData({ ...data, projects: [...data.projects, p] }); }}
              onImport={(p, replaceId) => {
                if (replaceId) setData(ensureVendors({ ...data, projects: data.projects.map((x) => (x.id === replaceId ? { ...p, id: replaceId } : x)) }));
                else setData(ensureVendors({ ...data, projects: [...data.projects, p] }));
              }} />
          )}
          {tab === "project" && canSeeActive && (
            <ProjectView project={activeProject} saveProject={saveProject} vendors={data.vendors} mutate={mutate} isMgmt={isMgmt} ohRate={data.settings.ohRate ?? 0.12} submitActuals={(wk, vals) => { const d = JSON.parse(JSON.stringify(data)); const ap = makeApproval(d, "actuals", user.id, { projectId: activeProject.id, wk, vals }, activeProject.code + " w/c " + fmtWk(wk)); if (ap) { d.approvals.push(ap); setData(d); return true; } applyApproval(d, { type: "actuals", payload: { projectId: activeProject.id, wk, vals } }); setData(d); return false; }} onBack={() => { setTab("projects"); setProjectId(null); }} canEdit={true} />
          )}
          {tab === "project" && !canSeeActive && <div className="panel">You don't have access to this project. Ask management to assign it to you in Team & access.</div>}
          {tab === "corporate" && acc.corporate && <CorporateView data={data} setData={setData} me={user} canProfit={acc.profit} />}
          {tab === "vendors" && acc.registers && <VendorsView data={data} setData={setData} openProject={openProject} />}
          {tab === "clients" && acc.registers && <ClientsView data={data} setData={setData} openProject={openProject} />}
          {tab === "approvals" && <ApprovalsView data={data} setData={setData} me={user} />}
          {tab === "users" && acc.team && <UsersAdmin data={data} setData={setData} />}
        </div>
      </div>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
