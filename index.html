/* ---- storage shim: mimics the Claude artifact storage API on localStorage ---- */
(function () {
  if (window.storage) return;
  const P = "northflow-web:";
  window.storage = {
    async get(key) {
      const v = localStorage.getItem(P + key);
      if (v === null) throw new Error("key not found: " + key);
      return { key, value: v };
    },
    async set(key, value) { localStorage.setItem(P + key, String(value)); return { key, value }; },
    async delete(key) { localStorage.removeItem(P + key); return { key, deleted: true }; },
    async list(prefix) {
      const keys = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k.startsWith(P) && (!prefix || k.slice(P.length).startsWith(prefix))) keys.push(k.slice(P.length));
      }
      return { keys };
    },
  };
})();

/* ---------------- spread profiles ---------------- */
function weights(n, profile) {
  const w = [];
  for (let i = 0; i < n; i++) {
    if (profile === "linear") w.push(1);
    else if (profile === "front") w.push(n - i);
    else if (profile === "back") w.push(i + 1);
    else { // s-curve via smoothstep increments
      const t0 = i / n, t1 = (i + 1) / n;
      const S = (t) => 3 * t * t - 2 * t * t * t;
      w.push(S(t1) - S(t0));
    }
  }
  return w;
}
function spreadAmount(total, n, profile) {
  const w = weights(n, profile), sum = w.reduce((a, b) => a + b, 0);
  const arr = w.map((x) => Math.round((total * x) / sum));
  const drift = total - arr.reduce((a, b) => a + b, 0);
  arr[n - 1] += drift;
  return arr;
}
// build fc map: weekly spread from project start offset
function weeklyFc(projStart, total, fromWk, dur, profile) {
  const arr = spreadAmount(total, dur, profile), fc = {};
  arr.forEach((a, i) => { if (a) fc[addW(projStart, fromWk + i)] = a; });
  return fc;
}
// build fc map: 4-weekly payment cycle (valuation/application cadence)
function cycleFc(projStart, total, dur, profile, firstPay, cycle) {
  const w = spreadAmount(total, dur, profile);
  const fc = {}; let i = 0, payIdx = 0;
  while (i < dur) {
    const chunk = w.slice(i, i + cycle).reduce((a, b) => a + b, 0);
    if (chunk) {
      const k = addW(projStart, firstPay + payIdx * cycle);
      fc[k] = (fc[k] || 0) + chunk;
    }
    i += cycle; payIdx++;
  }
  return fc;

/* ---------------- deterministic rng for seed actuals ---------------- */
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };

function lineProj(line, curWk = CUR_WK) {
  // Projection per approved brief §4: closed weeks = actual only (0 if missing);

  // NO automatic redistribution, scaling, or balancing. Ever.
  const fcC = line.currentFc || {}, ac = line.ac || {};

  const { inn, out } = projectLines(p); // cashOnly: internal notional OH excluded
  const agg = {}; // wk -> {blIn, blOut, fcIn, fcOut, acIn, acOut, prIn, prOut}
  const touch = (k) => (agg[k] = agg[k] || { blIn: 0, blOut: 0, fcIn: 0, fcOut: 0, acIn: 0, acOut: 0, prIn: 0, prOut: 0, ohFc: 0, ohAc: 0 });
  const roll = (lines, dir) => lines.forEach((l) => {
    const { proj } = lineProj(l, curWk);
    Object.entries(l.baselineFc || {}).forEach(([k, v]) => { touch(k)[dir === "in" ? "blIn" : "blOut"] += v; });
    Object.entries((l.inactive ? {} : l.currentFc) || {}).forEach(([k, v]) => { if (!l.inactive || k < curWk) touch(k)[dir === "in" ? "fcIn" : "fcOut"] += v; });
    Object.entries(l.ac || {}).forEach(([k, v]) => { touch(k)[dir === "in" ? "acIn" : "acOut"] += v; });
    Object.entries(proj).forEach(([k, v]) => { touch(k)[dir === "in" ? "prIn" : "prOut"] += v; });
  });
  roll(inn, "in"); roll(out, "out");
  return agg;
}

function seriesToCurve(agg, curWk = CUR_WK) {
  const wks = Object.keys(agg).sort();
  let co = 0, cf = 0, cp = 0, ca = 0;
  return wks.map((k) => {
    const a = agg[k];
    co += (a.blIn || 0) - (a.blOut || 0);
    cf += a.fcIn - a.fcOut; cp += a.prIn - a.prOut;
    let actual = null;
    if (k <= curWk) { ca += a.acIn - a.acOut; actual = ca; }
    return { wk: k, label: fmtWk(k), original: co, forecast: cf, projected: cp, actual,
      inPlan: a.fcIn, outPlan: -a.fcOut, inAct: k <= curWk ? a.acIn : null, outAct: k <= curWk ? -a.acOut : null,
      netPlan: a.fcIn - a.fcOut, netAct: k <= curWk ? a.acIn - a.acOut : null, netMove: a.prIn - a.prOut, netProj: a.prIn - a.prOut };
  });
}

/* ---------------- corporate aggregation ---------------- */
const ACCESS = {
  qs:         { dashboard: "my", allProjects: false, corporate: false, profit: false, registers: false, team: false },
  pm:         { dashboard: "my", allProjects: false, corporate: false, profit: false, registers: false, team: false },
  pd:         { dashboard: "projects", allProjects: true, corporate: false, profit: false, registers: true, team: false },
  hoc:        { dashboard: "projects", allProjects: true, corporate: false, profit: false, registers: true, team: false },
  accountant: { dashboard: "corporate", allProjects: true, corporate: true, profit: false, registers: true, team: true },
  director:   { dashboard: "corporate", allProjects: true, corporate: true, profit: true, registers: true, team: true },
};
const accessOf = (role) => ACCESS[role] || ACCESS.qs;
function corporateAgg(data, curWk, includeOverheads = true) {
  const agg = {}; // wk -> {fcIn, fcOut, acIn, acOut, prIn, prOut}
  const touch = (k) => (agg[k] = agg[k] || { blIn: 0, blOut: 0, fcIn: 0, fcOut: 0, acIn: 0, acOut: 0, prIn: 0, prOut: 0, ohFc: 0, ohAc: 0 });
  data.projects.forEach((p) => {
    const s = projectSeries(p, curWk);
    Object.entries(s).forEach(([k, a]) => {
      const t = touch(k);
      t.blIn += a.blIn || 0; t.blOut += a.blOut || 0;
      t.fcIn += a.fcIn; t.fcOut += a.fcOut; t.acIn += a.acIn; t.acOut += a.acOut; t.prIn += a.prIn; t.prOut += a.prOut;
    });
  });
  if (includeOverheads) data.overheads.forEach((l) => {
    const { proj } = lineProj(l, curWk);
    Object.entries(l.baselineFc || {}).forEach(([k, v]) => { touch(k).blOut += v; });
    Object.entries(l.currentFc || {}).forEach(([k, v]) => { const t = touch(k); t.fcOut += v; t.ohFc += v; });
    Object.entries(l.ac || {}).forEach(([k, v]) => { const t = touch(k); t.acOut += v; t.ohAc += v; });
    Object.entries(proj).forEach(([k, v]) => { touch(k).prOut += v; });
  });
  return agg;
}
function corporateCurve(data, curWk = CUR_WK, scope = "corporate") {
  const projOnly = scope === "projects";
  const agg = corporateAgg(data, curWk, !projOnly);
  const wks = Object.keys(agg).sort();
  const open = projOnly ? 0 : data.settings.openingBalance;
  let bal = open, fbal = open, obal = open, abal = open;
  return wks.map((k) => {
    const a = agg[k];
    bal += a.prIn - a.prOut; fbal += a.fcIn - a.fcOut; obal += (a.blIn || 0) - (a.blOut || 0);
    let actual = null;
    if (k <= curWk) { abal += a.acIn - a.acOut; actual = abal; }
    return { wk: k, label: fmtWk(k), original: obal, projected: bal, forecast: fbal, actual, netMove: a.prIn - a.prOut,
      inPlan: a.fcIn, outPlan: -(a.fcOut - a.ohFc), ohOutPlan: -a.ohFc,
      inAct: k <= curWk ? a.acIn : null, outAct: k <= curWk ? -(a.acOut - a.ohAc) : null, ohOutAct: k <= curWk ? -a.ohAc : null,
      netPlan: a.fcIn - a.fcOut, netAct: k <= curWk ? a.acIn - a.acOut : null };
  });
}

/* ---------------- atoms ---------------- */
function Modal({ title, onClose, children, wide }) {
  return (
    <div className="overlay" onClick={(e) => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="modal" style={wide ? { maxWidth: 900 } : null}>
        <h2>{title}</h2>
        {children}
      </div>
    </div>
  );
}
function Field({ label, children }) {
  return <div className="field"><label>{label}</label>{children}</div>;
}
function VarBadge({ v, invert }) {
  if (Math.abs(v) < 1) return <span className="badge b">on plan</span>;
  const fav = invert ? v < 0 : v > 0;
  return <span className={"badge " + (fav ? "g" : "r")}>{v > 0 ? "+" : ""}{moneyK(v)}</span>;
}

/* ---------------- cash curve chart ---------------- */
function toMonthly(curve) {
  const byM = new Map();
  curve.forEach((p) => {
    const mk = p.wk.slice(0, 7);
    if (!byM.has(mk)) byM.set(mk, { pts: [] });
    byM.get(mk).pts.push(p);
  });
  return [...byM.entries()].map(([mk, { pts }]) => {
    const last = pts[pts.length - 1];
    let actual = null;
    for (let i = pts.length - 1; i >= 0; i--) if (pts[i].actual !== null && pts[i].actual !== undefined) { actual = pts[i].actual; break; }
    const sumF = (f) => { let any = false, t = 0; pts.forEach((p) => { if (p[f] !== null && p[f] !== undefined) { any = true; t += p[f]; } }); return any ? t : null; };
    const d = new Date(mk + "-01T12:00:00");
    return { wk: last.wk, label: d.toLocaleDateString("en-GB", { month: "short", year: "2-digit" }), forecast: last.forecast, projected: last.projected, actual,
      netMove: sumF("netMove") || 0, netPlan: sumF("netPlan"), netAct: sumF("netAct"),
      inPlan: sumF("inPlan"), outPlan: sumF("outPlan"), inAct: sumF("inAct"), outAct: sumF("outAct"),
      ohOutPlan: sumF("ohOutPlan"), ohOutAct: sumF("ohOutAct") };
  });
}
function ceilMonday(d) {
  const x = new Date(d);
  const day = (x.getDay() + 6) % 7;
  if (day !== 0) x.setDate(x.getDate() + (7 - day));
  return wkKey(x);
}
function periodRange(yr, per) {
  const R = { FY: [0, 1, 11, 31], H1: [0, 1, 5, 30], H2: [6, 1, 11, 31], Q1: [0, 1, 2, 31], Q2: [3, 1, 5, 30], Q3: [6, 1, 8, 30], Q4: [9, 1, 11, 31] };
  const r = R[per];
  if (!r) return null;
  return { from: ceilMonday(new Date(yr, r[0], r[1])), to: wkKey(new Date(yr, r[2], r[3])) };
}
function PeriodSeg({ per, setPer }) {
  return (
    <div className="seg">
      {["FY", "H1", "H2", "Q1", "Q2", "Q3", "Q4"].map((p) => (
        <button key={p} className={per === p ? "on" : ""} onClick={() => setPer(per === p ? null : p)}>{p}</button>
      ))}
    </div>
  );
}
function YearPager({ yr, setYr }) {
  return (
    <div className="seg">
      <button onClick={() => setYr(yr - 1)}>‹</button>
      <button className="on" onClick={() => setYr(new Date().getFullYear())} title="Back to current year">FY{yr}</button>
      <button onClick={() => setYr(yr + 1)}>›</button>
    </div>
  );
}
function GranSeg({ gran, setGran }) {
  return (
    <div className="seg">
      {[["w", "Weekly"], ["m", "Monthly"]].map(([v, l]) => <button key={v} className={gran === v ? "on" : ""} onClick={() => setGran(v)}>{l}</button>)}
    </div>
  );
}
function ChartLegend({ split }) {
  return (
    <div className="legend" style={{ marginTop: 4, fontFamily: "var(--body)" }}>
      <span><i style={{ background: "#8A97A5" }} />Original cashflow forecast</span>{" "}
      <span><i style={{ background: "#1E5AA8" }} />Current cashflow forecast</span>{" "}
      <span><i style={{ background: "#0A235B" }} />Actual cashflow</span>{" "}
      <span><i style={{ background: "#5B6770" }} />Projected cashflow</span>{" "}
      <span><i style={{ background: "#1E5AA8", opacity: 0.45 }} />In forecast (bar)</span>{" "}
      <span><i style={{ background: "#5B6770", opacity: 0.45 }} />Out forecast (bar)</span>{" "}
      <span><i style={{ background: "#1F7A5C" }} />In actual (bar)</span>{" "}
      <span><i style={{ background: "#E8A33D" }} />Out actual (bar)</span>
      {split && <>{" "}<span><i style={{ background: "#8A97A5" }} />OH forecast</span>{" "}<span><i style={{ background: "#B3402E" }} />OH actual</span></>}
    </div>
  );
}
function ModeSeg({ mode, setMode }) {
  return (
    <div className="seg">
      {[["plan", "Forecast"], ["act", "Actual"], ["both", "Forecast v actual"]].map(([v, l]) => (
        <button key={v} className={mode === v ? "on" : ""} onClick={() => setMode(v)}>{l}</button>
      ))}
    </div>
  );
}
function isoWeek(d) {
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const dayn = (t.getUTCDay() + 6) % 7;
  t.setUTCDate(t.getUTCDate() - dayn + 3);
  const firstThu = new Date(Date.UTC(t.getUTCFullYear(), 0, 4));
  return 1 + Math.round(((t - firstThu) / 86400000 - 3 + ((firstThu.getUTCDay() + 6) % 7)) / 7);
}
function CashChart({ curve, height, zeroLine, gran, mode }) {
  const md = mode || "both";
  const hasOH = curve.length > 0 && curve[0].ohOutPlan !== undefined;
  const hasProj = curve.length > 0 && curve[0].inPlan !== undefined;
  const showPlan = md !== "act", showAct = md !== "plan";
  // aligned zero: force both axes to share the zero fraction
  let cumMin = 0, cumMax = 0, perMin = 0, perMax = 0;
  curve.forEach((p) => {
    ["forecast", "projected", "actual"].forEach((f) => { const v = p[f]; if (v !== null && v !== undefined) { cumMin = Math.min(cumMin, v); cumMax = Math.max(cumMax, v); } });
    const pl = (p.inPlan || 0), plo = (p.outPlan || 0) + (p.ohOutPlan || 0);
    const ai = (p.inAct || 0), ao = (p.outAct || 0) + (p.ohOutAct || 0);
    perMax = Math.max(perMax, pl, ai); perMin = Math.min(perMin, plo, ao);
  });
  cumMax = Math.max(cumMax, 1); perMax = Math.max(perMax, 1);
  const frac = Math.max(-cumMin / (cumMax - cumMin || 1), -perMin / (perMax - perMin || 1), 0.0001);
  const cumDom = [-frac / (1 - frac) * cumMax, cumMax];
  const perDom = [-frac / (1 - frac) * perMax, perMax];
  const wkOf = {}; curve.forEach((p) => { wkOf[p.label] = p.wk; });
  const CalTick = (props) => {
    const { x, y, payload } = props;
    const wk = wkOf[payload.value];
    if (!wk) return null;
    const d = new Date(wk + "T12:00:00");
    const top = gran === "m" ? payload.value : "W" + isoWeek(d);
    const bot = gran === "m" ? "" : d.toLocaleDateString("en-GB", { day: "numeric", month: "short" });
    return (
      <g transform={"translate(" + x + "," + y + ")"}>
        <text dy={10} textAnchor="middle" fontSize={9.5} fontFamily="Roboto" fill="#5B6770">{top}</text>
        {bot && <text dy={21} textAnchor="middle" fontSize={9} fontFamily="Roboto" fill="#8A97A5">{bot}</text>}
      </g>
    );
  };
  const qLines = [];
  let lastQ = null;
  curve.forEach((p) => {
    const d = new Date(p.wk + "T12:00:00");
    const q = d.getFullYear() + "-Q" + (Math.floor(d.getMonth() / 3) + 1);
    if (q !== lastQ) { if (lastQ !== null) qLines.push({ label: p.label, q: "Q" + (Math.floor(d.getMonth() / 3) + 1) + " '" + String(d.getFullYear()).slice(2) }); lastQ = q; }
  });
  const NAME = { inPlan: "Cash in — current forecast", outPlan: hasOH ? "Project costs — current forecast" : "Cash out — current forecast", ohOutPlan: "OH costs — current forecast",
    inAct: "Cash in — actual", outAct: hasOH ? "Project costs — actual" : "Cash out — actual", ohOutAct: "OH costs — actual",
    original: "Original cashflow forecast", forecast: "Current cashflow forecast", projected: "Projected cashflow", actual: "Actual cashflow" };
  return (
    <div style={{ width: "100%", height: height || 260 }}>
      <ResponsiveContainer>
        <ComposedChart data={curve} margin={{ top: 8, right: 12, left: 8, bottom: gran === "m" ? 4 : 12 }} barGap={1} barCategoryGap="22%">
          <CartesianGrid stroke="#EDEBE3" vertical={false} />
          <XAxis dataKey="label" tick={<CalTick />} interval="preserveStartEnd" minTickGap={gran === "m" ? 18 : 34} height={gran === "m" ? 22 : 32} />
          <YAxis yAxisId="cum" domain={cumDom} allowDataOverflow tick={{ fontSize: 10, fontFamily: "Roboto" }} tickFormatter={(v) => moneyK(v)} width={58} tickCount={8}
            label={{ value: "AED — cumulative", angle: -90, position: "insideLeft", style: { fontSize: 10, fontFamily: "Roboto", fill: "#5B6770" } }} />
          <YAxis yAxisId="per" orientation="right" domain={perDom} allowDataOverflow tick={{ fontSize: 10, fontFamily: "Roboto" }} tickFormatter={(v) => moneyK(v)} width={58} tickCount={8}
            label={{ value: "AED — " + (gran === "m" ? "monthly" : "weekly"), angle: 90, position: "insideRight", style: { fontSize: 10, fontFamily: "Roboto", fill: "#5B6770" } }} />
          <Tooltip shared={false} formatter={(v, n) => [money(v), NAME[n] || n]} labelStyle={{ fontFamily: "Roboto", fontSize: 11, fontWeight: 600 }} contentStyle={{ fontFamily: "Roboto", fontSize: 12, borderRadius: 6 }} />
          <ReferenceArea yAxisId="cum" y1={cumDom[0]} y2={0} fill="#C0392B" fillOpacity={0.06} />
          {zeroLine && <ReferenceLine yAxisId="cum" y={0} stroke="#C0392B" strokeDasharray="2 3" />}
          {qLines.map((ql) => <ReferenceLine key={ql.label + ql.q} yAxisId="cum" x={ql.label} stroke="#B9C2CB" strokeDasharray="4 4" label={{ value: ql.q, fontSize: 9, fill: "#8A97A5", position: "insideTopLeft" }} />)}
          <ReferenceLine yAxisId="cum" x={fmtWk(CUR_WK)} stroke="#E89B00" strokeWidth={2} label={{ value: "now", fontSize: 10, fill: "#8A5C00", position: "top" }} />
          {hasProj && showPlan && <Bar yAxisId="per" stackId="plan" dataKey="inPlan" fill="#1E5AA8" fillOpacity={0.4} name="inPlan" />}
          {hasProj && showPlan && <Bar yAxisId="per" stackId="plan" dataKey="outPlan" fill="#5B6770" fillOpacity={0.4} name="outPlan" />}
          {hasOH && showPlan && <Bar yAxisId="per" stackId="plan" dataKey="ohOutPlan" fill="#8A97A5" fillOpacity={0.55} name="ohOutPlan" />}
          {hasProj && showAct && <Bar yAxisId="per" stackId="act" dataKey="inAct" fill="#1F7A5C" fillOpacity={0.7} name="inAct" />}
          {hasProj && showAct && <Bar yAxisId="per" stackId="act" dataKey="outAct" fill="#E8A33D" fillOpacity={0.75} name="outAct" />}
          {hasOH && showAct && <Bar yAxisId="per" stackId="act" dataKey="ohOutAct" fill="#B3402E" fillOpacity={0.7} name="ohOutAct" />}
          {showPlan && <Line yAxisId="cum" type="monotone" dataKey="original" stroke="#8A97A5" strokeDasharray="7 4" dot={false} strokeWidth={1.3} name="original" />}
          {showPlan && <Line yAxisId="cum" type="monotone" dataKey="forecast" stroke="#1E5AA8" strokeDasharray="6 4" dot={false} strokeWidth={1.6} name="forecast" />}
          {md === "both" && <Line yAxisId="cum" type="monotone" dataKey="projected" stroke="#5B6770" strokeDasharray="3 3" dot={false} strokeWidth={1.6} name="projected" />}
          {showAct && <Area yAxisId="cum" type="monotone" dataKey="actual" stroke="#0A235B" fill="#0A235B22" dot={false} strokeWidth={2.4} name="actual" connectNulls={false} />}
        </ComposedChart>
      </ResponsiveContainer>
    </div>
  );
}

/* ---------------- spread editor (forecast per week) ---------------- */
function SpreadEditor({ line, projStart, onSave, onClose, allowValue, onDeactivate, canDelete, onDelete }) {
  const [fc, setFc] = useState({ ...(line.currentFc || {}) });
  const [value, setValue] = useState(line.value || 0);
  const [qTotal, setQTotal] = useState(line.value || 0);
  const [qFrom, setQFrom] = useState(0);
  const [qDur, setQDur] = useState(8);
  const [qProfile, setQProfile] = useState("scurve");
  const [qCycle, setQCycle] = useState("4");
  const wks = useMemo(() => {
    const keys = Object.keys(fc).sort();
    const startK = keys.length ? (keys[0] < projStart ? keys[0] : projStart) : projStart;
    const endK = keys.length ? keys[keys.length - 1] : addW(projStart, 12);
    const n = Math.max(wkDiff(startK, endK) + 5, 14);
    return Array.from({ length: n }, (_, i) => addW(startK, i));
  }, [fc, projStart]);
  const total = sumMap(fc);
  const blTotal = sumMap(line.baselineFc || {});
  const acSum = sumMap(line.ac || {});
  const cwRemaining = fc[CUR_WK] || 0;
  const futTotal = Object.entries(fc).reduce((a, [k, v]) => a + (k > CUR_WK ? v : 0), 0);
  const unalloc = line.recurring ? null : (num(value) || 0) - acSum - cwRemaining - futTotal;
  const recStatus = unalloc === null ? null : Math.abs(unalloc) <= 0.5 ? "reconciled" : unalloc > 0 ? "unallocated" : "overallocated";
  const hasClosedData = Object.keys(line.ac || {}).length > 0 || Object.keys(fc).some((k) => k < CUR_WK);
  const [preview, setPreview] = useState(null); // pending replace-future spread
  const copyBaseline = () => { if (window.confirm("Replace the current forecast with the original forecast? Actuals are unaffected.")) setFc({ ...(line.baselineFc || {}) }); };
  const clearFuture = () => { if (window.confirm("Clear the current forecast for this week and all future weeks?")) { const n = { ...fc }; Object.keys(n).forEach((k) => { if (k >= CUR_WK) delete n[k]; }); setFc(n); } };
  const [mvFrom, setMvFrom] = useState(""); const [mvTo, setMvTo] = useState(""); const [mvAmt, setMvAmt] = useState("");
  const moveAmt = () => {
    const a = num(mvAmt); if (!mvFrom || !mvTo || !a) return;
    const n = { ...fc };
    n[mvFrom] = (n[mvFrom] || 0) - a; if (Math.abs(n[mvFrom]) < 0.5) delete n[mvFrom];
    n[mvTo] = (n[mvTo] || 0) + a;
    setFc(n); setMvAmt("");
  };
  const applySpread = () => {
    const gen = qCycle === "1"
      ? weeklyFc(projStart, num(qTotal), Number(qFrom), Number(qDur), qProfile)
      : cycleFc(projStart, num(qTotal), Number(qDur), qProfile, Number(qFrom), Number(qCycle));
    if (!hasClosedData) { setFc(gen); return; } // initial spread — first forecast creation
    // Replace-future mode: closed weeks are never modified; requires preview + confirmation.
    const next = { ...fc };
    Object.keys(next).forEach((k) => { if (k >= CUR_WK) delete next[k]; });
    Object.entries(gen).forEach(([k, v]) => { if (k >= CUR_WK) next[k] = v; });
    setPreview({ next, beforeFut: Object.entries(fc).reduce((a, [k, v]) => a + (k >= CUR_WK ? v : 0), 0), afterFut: Object.entries(next).reduce((a, [k, v]) => a + (k >= CUR_WK ? v : 0), 0) });
  };
  return (
    <Modal title={"Forecast — " + line.name} onClose={onClose} wide>
      <div style={{ display: "flex", gap: 14, flexWrap: "wrap", fontSize: 12, fontFamily: "var(--body)", background: "var(--paper)", border: "1px solid var(--line)", borderRadius: 6, padding: "8px 10px", marginBottom: 10 }}>
        <span>Line value <b className="mono">{money(num(value) || 0)}</b></span>
        <span>Original forecast <b className="mono">{money(blTotal)}</b></span>
        <span>Current forecast <b className="mono">{money(total)}</b></span>
        <span>Actual to date <b className="mono">{money(acSum)}</b></span>
        <span>Remaining this week <b className="mono">{money(cwRemaining)}</b></span>
        <span>Future forecast <b className="mono">{money(futTotal)}</b></span>
        {recStatus && <span>Unallocated <b className="mono" style={{ color: recStatus === "reconciled" ? "var(--green)" : recStatus === "unallocated" ? "var(--hivis)" : "var(--red)" }}>{money(unalloc)} · {recStatus}</b></span>}
        {line.forecastUpdatedAt && <span style={{ color: "var(--ink2)" }}>Forecast updated {new Date(line.forecastUpdatedAt).toLocaleDateString("en-GB")}</span>}
      </div>
      <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 10 }}>
        <button className="btn ghost" onClick={copyBaseline}>Copy original → current</button>
        <button className="btn ghost" onClick={clearFuture}>Clear future forecast</button>
        <span style={{ display: "inline-flex", gap: 4, alignItems: "center", fontSize: 12 }}>
          Move <input value={mvAmt} onChange={(e) => setMvAmt(e.target.value)} placeholder="amount" style={{ width: 70 }} inputMode="numeric" />
          from <select value={mvFrom} onChange={(e) => setMvFrom(e.target.value)}><option value="">week…</option>{Object.keys(fc).sort().map((k) => <option key={k} value={k}>{fmtWk(k)}</option>)}</select>
          to <select value={mvTo} onChange={(e) => setMvTo(e.target.value)}><option value="">week…</option>{wks.map((k) => <option key={k} value={k}>{fmtWk(k)}</option>)}</select>
          <button className="btn ghost" onClick={moveAmt}>Move</button>
        </span>
        {onDeactivate && sumMap(line.ac || {}) !== 0 && !line.inactive && <button className="btn ghost" style={{ color: "var(--red)" }} onClick={() => { if (window.confirm("Deactivate this line? Historical actuals remain in reporting; future forecast is excluded.")) onDeactivate(true); }}>Deactivate line</button>}
        {onDeactivate && line.inactive && <button className="btn ghost" onClick={() => onDeactivate(false)}>Reactivate line</button>}
        {canDelete && onDelete && Object.keys(line.ac || {}).length === 0 && <button className="btn ghost" style={{ color: "var(--red)" }} onClick={() => { if (window.confirm("Delete this line? It has no actuals.")) onDelete(); }}>Delete line</button>}
      </div>
      {preview && (
        <div style={{ background: "var(--hivis-soft)", border: "1px solid var(--hivis)", borderRadius: 6, padding: "8px 10px", marginBottom: 10, fontSize: 12 }}>
          <b>Replace future forecast with spread?</b> Closed weeks are not modified.
          Current + future forecast: <b className="mono">{money(preview.beforeFut)}</b> → <b className="mono">{money(preview.afterFut)}</b>.{" "}
          <button className="btn" onClick={() => { setFc(preview.next); setPreview(null); }}>Confirm replace</button>{" "}
          <button className="btn ghost" onClick={() => setPreview(null)}>Cancel</button>
        </div>
      )}
      <div className="frow">
        {allowValue && (
          <Field label="Line value (AED)">
            <input value={value} onChange={(e) => setValue(e.target.value)} />
          </Field>
        )}
        <Field label="Spread total (AED)"><input value={qTotal} onChange={(e) => setQTotal(e.target.value)} /></Field>
        <Field label="From wk # (0 = start)"><input value={qFrom} onChange={(e) => setQFrom(e.target.value)} /></Field>
        <Field label="Duration (wks)"><input value={qDur} onChange={(e) => setQDur(e.target.value)} /></Field>
        <Field label="Profile">
          <select value={qProfile} onChange={(e) => setQProfile(e.target.value)}>
            <option value="scurve">S-curve</option><option value="linear">Linear</option>
            <option value="front">Front-loaded</option><option value="back">Back-loaded</option>
          </select>
        </Field>
        <Field label="Payment cycle">
          <select value={qCycle} onChange={(e) => setQCycle(e.target.value)}>
            <option value="1">Weekly</option><option value="4">4-weekly</option>
          </select>
        </Field>
        <div className="field" style={{ display: "flex", alignItems: "flex-end", minWidth: 90 }}>
          <button className="btn ghost sm" onClick={applySpread}>{hasClosedData ? "Replace future forecast with spread" : "Initial spread"}</button>
        </div>
      </div>
      <div style={{ fontFamily: "var(--mono)", fontSize: 12, color: "var(--ink2)" }}>
        Forecast total: <b style={{ color: "var(--ink)" }}>{money(total)}</b>
        {allowValue && <> · Line value: <b style={{ color: Math.abs(total - num(value)) > 1 ? "var(--red)" : "var(--green)" }}>{money(num(value))}</b></>}
      </div>
      <div className="wkgrid">
        {wks.map((k) => (
          <div className="wkcell" key={k}>
            <label>{fmtWk(k)}{k === CUR_WK ? " ◂now" : ""}</label>
            <input
              value={fc[k] ?? ""}
              placeholder="0"
              onChange={(e) => {
                const v = e.target.value;
                setFc((prev) => {
                  const n2 = { ...prev };
                  if (v === "" || num(v) === 0) delete n2[k]; else n2[k] = num(v);
                  return n2;
                });
              }}
            />
          </div>
        ))}
      </div>
      <div className="mfoot">
        <button className="btn ghost" onClick={onClose}>Cancel</button>

              {tObj.lines.map((l) => <option key={l.id} value={l.id}>{l.name}</option>)}

        <Field label="Week commencing">

            {wks.filter((k) => k <= CUR_WK).map((k) => <option key={k} value={k}>{fmtWk(k)}{k === CUR_WK ? " (this week — open)" : ""}</option>)}

function ProjectGrid({ project, onEditLine, onInvoices, onClientInvoices, range }) {
  const { inn, out } = projectLines(project, { cashOnly: false }); // internal rows shown tagged; totals (agg) exclude them
  const agg = projectSeries(project, CUR_WK);
  let wks = Object.keys(agg).sort();
  if (range) wks = wks.filter((k) => k >= range.from && k <= range.to);
  const projCache = useMemo(() => {
    const m = {};
    [...inn, ...out].forEach((l) => { m[l.id] = lineProj(l, CUR_WK).proj; });
    return m;
  }, [project]);

  const cell = (l, k) => {
    const fc = (l.currentFc || {})[k], ac = (l.ac || {})[k], pj = (projCache[l.id] || {})[k];

    pkg, lines: out.filter((l) => l.pkgId === pkg.id),

      })}

  );

  const cumProjVals = {}, cumFcVals = {};

    const a = agg[k];
    cumP += a.prIn - a.prOut; cumF += a.fcIn - a.fcOut;
    cumProjVals[k] = cumP; cumFcVals[k] = cumF;
  });

  return (
    <div>
      <div className="legend">
        <span><i style={{ background: "var(--ink)" }} />actual (bold)</span>
        <span><i style={{ background: "var(--blueprint)" }} />re-forecast</span>
        <span>f = original forecast</span>
        <span><i style={{ background: "var(--hivis-soft)", border: "1px solid var(--hivis)" }} />current week</span>

      </div>
      <div className="gridwrap">
        <table className="cg">
          <thead>
            <tr>
              <th className="rowname">Line</th>
              <th className="num">Value</th>
              {wks.map((k) => <th key={k} className={"num" + (k === CUR_WK ? " cur" : "")}>{fmtWk(k)}</th>)}
            </tr>
          </thead>
          <tbody>
            <tr className="grp"><td className="rowname">Cash in
              {onClientInvoices && <button className="btn ghost sm" style={{ padding: "1px 6px", fontSize: 10, textTransform: "none", letterSpacing: 0, marginLeft: 6 }} onClick={onClientInvoices}>
                Client invoices{clientUnpaid(project) > 0 ? " · " + moneyK(clientUnpaid(project)) + " outstanding" : ""}
              </button>}
            </td><td colSpan={wks.length + 1}></td></tr>
            {inn.map((l) => lineRow(l, false))}
            {totRow("Total in", (k) => agg[k].prIn)}

              <FragmentRows key={pkg.id} pkg={pkg} lines={lines} lineRow={lineRow} wkCount={wks.length} onInvoices={onInvoices} />
            ))}
            {totRow("Total out", (k) => agg[k].prOut)}
            {totRow("Net week — projected (excl notional OH)", (k) => agg[k].prIn - agg[k].prOut)}
            {totRow("Cumulative (projected)", (k) => cumProjVals[k], true)}
            {totRow("Cumulative (orig. forecast)", (k) => cumFcVals[k])}
          </tbody>
        </table>
      </div>
    </div>
  );
}
function FragmentRows({ pkg, lines, lineRow, wkCount, onInvoices }) {

function filterInvs(invs, range) {
  if (!range) return invs || [];
  return (invs || []).filter((i) => {

    return wk >= range.from && wk <= range.to;

function invoiceSplit(projects, range) {
  // Shared classifier: overdue = past the contractual due date (invoiceStatus), never raw age.
  const ar = { invoiced: 0, paid: 0, pendDue: 0, pendOver: 0 };
  const ap = { invoiced: 0, paid: 0, pendDue: 0, pendOver: 0 };
  const add = (t, i) => {
    t.invoiced += i.amount;
    if (i.status === "paid") { t.paid += i.amount; return; }
    if (invoiceStatus(i).daysOverdue > 0) t.pendOver += i.amount; else t.pendDue += i.amount;
  };
  projects.forEach((p) => {
    filterInvs(p.clientInvoices, range).forEach((i) => add(ar, i));
    p.packages.forEach((pk) => filterInvs(pk.invoices, range).forEach((i) => add(ap, i)));
  });
  return { ar, ap };
}

      const f = sumW(l.currentFc, inW);

            {invs.map((i) => (
              <tr key={i.id}>
                <td className="mono">{i.ref}</td>
                    <td className="mono">{i.date}{i.dueDate ? " · due " + i.dueDate : ""}{(() => { const st = invoiceStatus(i); return st.bucket !== "paid" && st.daysOverdue > 0 ? <span style={{ color: "var(--red)", fontWeight: 700 }}> · {st.daysOverdue}d overdue</span> : null; })()}</td>
                <td className="mono">{moneyK(i.amount)}</td>
                <td>
                  <button className="btn ghost sm" style={{ color: i.status === "paid" ? "var(--green)" : "var(--red)" }}
                    onClick={() => upd((t) => { const x = listOf(t).find((y) => y.id === i.id); x.status = x.status === "paid" ? "unpaid" : "paid"; })}>
                    {i.status === "paid" ? (clientMode ? "Received ✓" : "Paid ✓") : (clientMode ? "Outstanding — mark received" : "Unpaid — mark paid")}
                  </button>
                </td>
                <td><button className="btn ghost sm" onClick={() => upd((t, pr) => { if (clientMode) pr.clientInvoices = pr.clientInvoices.filter((y) => y.id !== i.id); else t.invoices = t.invoices.filter((y) => y.id !== i.id); })}>✕</button></td>
              </tr>
            ))}
          </tbody>
        </table>
      )}
      {invs.length === 0 && <div className="sub" style={{ marginBottom: 12 }}>No invoices recorded for this package yet.</div>}
      <div className="frow">
        <Field label="Invoice ref"><input value={f.ref} onChange={set("ref")} placeholder="e.g. INV-0142" /></Field>
        <Field label="Date"><input type="date" value={f.date} onChange={set("date")} /></Field>
        <Field label="Amount (AED)"><input value={f.amount} onChange={set("amount")} inputMode="decimal" /></Field>
      </div>
      <div className="mfoot">
        <button className="btn ghost" onClick={onClose}>Close</button>
        <button className="btn" disabled={!num(f.amount)} onClick={add}>Add invoice</button>
      </div>
      <p className="note">Marking an invoice paid/received tracks the ledger position only — record the cash movement itself in weekly actuals so the sheet stays the single source of truth for cash.</p>
    </Modal>
  );
}

function cellToWk(v) {
  let d = null;
  if (v instanceof Date) d = v;
  else if (typeof v === "number" && v > 20000) d = new Date(Math.round((v - 25569) * DAY));
  else if (typeof v === "string" && v.trim()) { const t = Date.parse(v); if (!isNaN(t)) d = new Date(t); }
  return d && !isNaN(d) ? wkKey(d) : null;
}
function parseWorkbook(wb, filename) {
  // Info sheet (optional): key/value pairs
  const info = {};
  const infoWs = wb.Sheets["Info"];
  if (infoWs) XLSX.utils.sheet_to_json(infoWs, { header: 1, raw: true, defval: null }).forEach((r) => {
    if (r && r[0]) info[String(r[0]).trim().toLowerCase()] = r[1];
  });
  const ws = wb.Sheets["Cashflow"] || wb.Sheets[wb.SheetNames.find((n) => n !== "Info")];
  if (!ws) throw new Error("No 'Cashflow' sheet found.");
  const rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: null });
  const hi = rows.findIndex((r) => r && String(r[0] || "").trim().toLowerCase() === "section");
  if (hi < 0) throw new Error("Header row not found — column A must contain 'Section'.");
  const header = rows[hi];
  const weekCols = [];
  for (let c = 5; c < header.length; c++) {
    const wk = cellToWk(header[c]);
    if (wk) weekCols.push({ c, wk });
  }
  if (!weekCols.length) throw new Error("No week date columns found after column E.");
  const lines = new Map();
  let skipped = 0;
  for (let r = hi + 1; r < rows.length; r++) {
    const row = rows[r];
    if (!row || row.every((x) => x === null || x === "")) continue;
    const sec = String(row[0] || "").trim().toUpperCase();
    if (sec !== "IN" && sec !== "OUT") { skipped++; continue; }
    const pkg = String(row[1] || "").trim();
    const lineName = String(row[2] || "").trim() || (sec === "IN" ? "Contract sum" : "Base package");
    const type = String(row[3] || "").trim().toLowerCase();
    const fa = String(row[4] || "f").trim().toLowerCase();
    const key = sec + "|" + pkg + "|" + lineName;
    if (!lines.has(key)) lines.set(key, { sec, pkg, lineName, type, fc: {}, ac: {} });
    const L = lines.get(key);
    const map = fa.startsWith("a") ? L.ac : L.fc;
    weekCols.forEach(({ c, wk }) => {
      const v = row[c];
      if (v === null || v === "") return;
      const n = Number(v);
      if (isNaN(n)) return;
      if (!fa.startsWith("a") && n === 0) return; // blank forecast; explicit 0 actual = slipped week, keep it
      map[wk] = (map[wk] || 0) + n;
    });
  }
  if (!lines.size) throw new Error("No IN/OUT data rows found.");
  const cashIn = [];
  const pkgMap = new Map();
  lines.forEach((L) => {
    const item = {
      id: uid(), name: L.lineName,
      type: L.sec === "IN" ? (L.type.startsWith("v") ? "variation" : "contract") : (L.type.startsWith("v") ? "variation" : "base"),
      value: Math.round(sumMap(L.fc)), baselineFc: L.fc, currentFc: JSON.parse(JSON.stringify(L.fc)), ac: L.ac, inactive: false,
    };
    if (L.sec === "IN") cashIn.push(item);
    else {
      const pname = L.pkg || "General";
      if (!pkgMap.has(pname)) pkgMap.set(pname, { id: uid(), name: pname, vendor: pname, lines: [] });
      pkgMap.get(pname).lines.push(item);
    }
  });
  const allWks = weekCols.map((w) => w.wk).sort();
  const start = cellToWk(info["start"]) || allWks[0];
  const weeks = Math.max(Number(info["weeks"]) || 0, wkDiff(start, allWks[allWks.length - 1]) + 1, 1);
  return {
    project: {
      id: uid(),
      code: String(info["code"] || "").trim() || "P-" + String(Date.now()).slice(-4),
      name: String(info["name"] || "").trim() || filename.replace(/\.(xlsx?|csv)$/i, ""),
      client: String(info["client"] || "").trim() || "—",
      start, weeks, cashIn, packages: [...pkgMap.values()],
    },
    stats: { lines: lines.size, weeks: weekCols.length, skipped,
      totalIn: cashIn.reduce((a, l) => a + sumMap(l.fc), 0),
      totalOut: [...pkgMap.values()].reduce((a, p) => a + p.lines.reduce((b, l) => b + sumMap(l.fc), 0), 0) },
  };
}
function downloadTemplate() {
  const wb = XLSX.utils.book_new();
  const mon = (n) => new Date(addW(CUR_WK, n) + "T12:00:00");
  const wks = [0, 1, 2, 3, 4, 5, 6, 7].map(mon);
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([
    ["Code", "P-201"], ["Name", "Sample Project — CAT B"], ["Client", "Client name"],
    ["Start", wks[0]], ["Weeks", 8],
  ]), "Info");
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([

function ExcelImport({ projects, onImport, onClose }) {

/* ---------------- corporate view ---------------- */
function overheadsCurve(overheads) {
  const wkset = new Set();
  overheads.forEach((l) => { Object.keys(l.currentFc || {}).concat(Object.keys(l.ac || {})).forEach((k) => wkset.add(k)); });
  const wks = [...wkset].sort();
  let cf = 0, cp = 0, ca = 0;
  return wks.map((k) => {
    let fcv = 0, acv = 0;
    overheads.forEach((l) => { fcv += (l.currentFc || {})[k] || 0; acv += (l.ac || {})[k] || 0; });
    const prv = k <= CUR_WK ? acv : fcv; // re-forecast: actuals to date, plan forward
    cf += fcv; cp += prv;
    let actual = null;
    if (k <= CUR_WK) { ca += acv; actual = ca; }
    return { wk: k, label: fmtWk(k), forecast: cf, projected: cp, actual, netMove: prv, ohOutPlan: -fcv, ohOutAct: k <= CUR_WK ? -acv : null, netPlan: -fcv, netAct: k <= CUR_WK ? -acv : null };
  });
}

function TextModal({ title, label, initial, onSave, onClose }) {
  const [v, setV] = useState(initial);
  return (
    <Modal title={title} onClose={onClose}>
      <div className="frow"><Field label={label}><input value={v} onChange={(e) => setV(e.target.value)} /></Field></div>

        <button className="btn" onClick={() => onSave(v)}>Save</button>
      </div>
    </Modal>

}
function OhWeekUpdate({ overheads, onSave, onClose }) {
  const wks = useMemo(() => {
    const s = new Set();
    overheads.forEach((l) => Object.keys(l.currentFc || {}).concat(Object.keys(l.ac || {})).forEach((k) => { if (k <= CUR_WK) s.add(k); }));
    return [...s].sort();
  }, [overheads]);
  const defWk = wks.filter((k) => k <= CUR_WK).pop() || wks[0];
  const [wkSel, setWkSel] = useState(defWk);
  const [vals, setVals] = useState({});
  useEffect(() => {
    const v = {};
    overheads.forEach((l) => { v[l.id] = l.ac && l.ac[wkSel] !== undefined ? String(l.ac[wkSel]) : ""; });
    setVals(v);
  }, [wkSel, overheads]);
  return (
    <Modal title="Record overhead actuals" onClose={onClose}>
      <div className="frow">
        <Field label="Week commencing">
          <select value={wkSel} onChange={(e) => setWkSel(e.target.value)}>
            {wks.map((k) => <option key={k} value={k}>{fmtWk(k)}{k === CUR_WK ? " (this week)" : ""}</option>)}
          </select>
        </Field>
      </div>
      {overheads.map((l) => (
        <div className="uline" key={l.id}>
          <div className="nm"><b>{l.name}</b><span>forecast {money((l.currentFc || {})[wkSel] || 0)}</span></div>
          <input inputMode="decimal" placeholder="—" value={vals[l.id] ?? ""} onChange={(e) => setVals({ ...vals, [l.id]: e.target.value })} />
        </div>
      ))}
      <div className="mfoot">
        <button className="btn ghost" onClick={onClose}>Cancel</button>
        <button className="btn amber" onClick={() => onSave(wkSel, vals)}>Save actuals</button>
      </div>
    </Modal>
  );
}

function Dashboard({ data, projects, openProject, scope }) {

  const curve = corporateCurve(scoped, CUR_WK, projOnly ? "projects" : "corporate");
  const nowPt = [...curve].reverse().find((c) => c.wk <= CUR_WK) || curve[0];
  const at = (n) => { const k = addW(CUR_WK, n); const pt = [...curve].reverse().find((c) => c.wk <= k); return pt ? pt.projected : nowPt?.projected || 0; };
  const [hz, setHz] = useState(13);
  const [gran, setGran] = useState("w");
  const HZS = [[4, "1 mo"], [13, "3 mo"], [26, "6 mo"], [52, "12 mo"], ["ytd", "YTD"]];
  const [yr, setYr] = useState(new Date().getFullYear());
  const [per, setPer] = useState(null);
  const [mDetail, setMDetail] = useState(null);
  const [mode, setMode] = useState("both");
  const nowYr = new Date().getFullYear();
  const isYtd = hz === "ytd";
  const hzLabel = HZS.find(([w]) => w === hz)[1];
  let winFrom = isYtd ? YEAR_WK : addW(CUR_WK, -8), winTo = isYtd ? CUR_WK : addW(CUR_WK, hz);
  const pr_ = periodRange(yr, per);
  if (pr_) { winFrom = pr_.from; winTo = pr_.to; }
  else if (yr !== nowYr) { winFrom = ceilMonday(new Date(yr, 0, 1)); winTo = wkKey(new Date(yr, 11, 31)); }
  const win = curve.filter((c) => c.wk >= (isYtd ? YEAR_WK : CUR_WK) && c.wk <= winTo);
  const trough = win.reduce((m, p) => Math.min(m, p.projected), Infinity);
  const troughPt = win.find((p) => p.projected === trough);
  const ytdStart = curve.find((c) => c.wk >= YEAR_WK);

  // variance alerts: project lines materially off plan to date
  const alerts = [];
  projects.forEach((p) => {
    projectLines(p).all.forEach((l) => {
      let fcTD = 0, acTD = 0;
      Object.entries(l.currentFc || {}).forEach(([k, v]) => { if (k < CUR_WK) fcTD += v; });
      Object.entries(l.ac || {}).forEach(([k, v]) => { if (k < CUR_WK) acTD += v; });
      const dv = acTD - fcTD;
      const material = Math.abs(dv) > Math.max(10000, 0.1 * (l.value || 0));
      if (material && fcTD > 0) alerts.push({ p, l, dv });
    });
  });
  alerts.sort((a, b) => Math.abs(b.dv) - Math.abs(a.dv));

  return (
    <div>

        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
          <YearPager yr={yr} setYr={setYr} />
          <PeriodSeg per={per} setPer={setPer} />
          <ModeSeg mode={mode} setMode={setMode} />
          <GranSeg gran={gran} setGran={setGran} />
          {yr === nowYr && !per && <div className="seg">{HZS.map(([w, l]) => <button key={w} className={hz === w ? "on" : ""} onClick={() => setHz(w)}>{l}</button>)}</div>}
        </div>
      </div>
      <StandardTop projects={projects} overheads={projOnly ? null : data.overheads} ohRate={ohRateFor(data.settings, yr)} yr={yr} per={per} onDetail={(t) => setMDetail(t)}
        cashLabel={scope === "my" ? "My projects — net cash to date" : projOnly ? "Projects — net cash to date" : "Modelled cash position"}
        cashValue={nowPt?.projected} cashSub={projOnly ? "cash in − cash out, actuals to date" : "opening balance + actuals to date"}
        range={(per ? periodRange(yr, per) : yr !== nowYr ? { from: ceilMonday(new Date(yr, 0, 1)), to: wkKey(new Date(yr, 11, 31)) } : null)} rangeLabel={(per ? per + " " + yr : yr !== nowYr ? "FY" + yr : hzLabel)}
        curveWin={(gran === "m" ? toMonthly : (x) => x)(curve.filter((c) => c.wk >= winFrom && c.wk <= winTo))} gran={gran} mode={mode} split={!projOnly}
        chartNote={projOnly ? "all projects, excl corporate OH" : "incl corporate OH"} />
      {mDetail && <MarginDetailModal projects={projects} title={mDetail} onClose={() => setMDetail(null)} />}
      {mDetail && <MarginDetailModal projects={projects} title={mDetail} onClose={() => setMDetail(null)} />}
      <div className="panel" style={{ padding: 0 }}>
        <h2 style={{ padding: "14px 16px 0" }}>Invoiced vs paid — by project</h2>
        <div className="gridwrap">
          <table className="tbl">

            <tbody>

                const s = commercialSummary(p, ohRateFor(data.settings, new Date().getFullYear()));
                const net = s.invInDue - s.invOutDue;
                return (
                  <tr key={p.id} style={{ cursor: "pointer" }} onClick={() => openProject(p.id)}>
                    <td><b>{p.code}</b> <span className="sub">{p.name.slice(0, 26)}</span></td>
                    <td className="r mono">{moneyK(s.invIn)}</td>
                    <td className="r mono">{moneyK(s.recd)}</td>

                }, { ii: 0, r: 0, di: 0, po: 0, doo: 0 });
                return (
                  <tr style={{ borderTop: "2px solid var(--ink)" }}>
                    <td><b>Total</b></td>

                    <td className="r mono"><b>{moneyK(t.di - t.doo)}</b></td>

              })()}
            </tbody>
          </table>
        </div>
        <p className="note" style={{ padding: "0 16px 12px" }}>"Due from client" = client invoices/applications not yet paid (receivable). "Due to vendors" = vendor invoices logged but unpaid — a liability even where payment is being withheld. Net due = receivable − liability. Received/paid are cash per the sheets.</p>
      </div>
      <div className="panel" style={{ padding: 0 }}>
        <h2 style={{ padding: "14px 16px 0" }}>Projects</h2>
        <table className="tbl">
          <thead><tr><th>Project</th><th className="mono">Value in</th><th className="mono">Proj. final</th><th>Vs plan</th></tr></thead>
          <tbody>
            {projects.map((p) => {
              const c = seriesToCurve(projectSeries(p, CUR_WK));
              const fin = c.length ? c[c.length - 1] : { forecast: 0, projected: 0 };
              const totalIn = p.cashIn.reduce((a, l) => a + (l.value || 0), 0);
              return (
                <tr key={p.id} className="click" onClick={() => openProject(p.id)}>
                  <td>{p.code} — {p.name}</td>
                  <td className="mono">{moneyK(totalIn)}</td>
                  <td className="mono">{moneyK(fin.projected)}</td>
                  <td><VarBadge v={fin.projected - fin.forecast} /></td>

        </table>
      </div>
      {alerts.length > 0 && (
        <div className="panel" style={{ padding: 0 }}>
          <h2 style={{ padding: "14px 16px 0" }}>Variance watch — lines off plan to date</h2>
          <table className="tbl">
            <thead><tr><th>Project</th><th>Line</th><th>To-date variance</th></tr></thead>
            <tbody>
              {alerts.slice(0, 8).map(({ p, l, dv }, i) => (
                <tr key={i} className="click" onClick={() => openProject(p.id)}>
                  <td className="mono">{p.code}</td>
                  <td>{l.group !== "Cash in" ? l.group + " — " : "Cash in — "}{l.name}</td>
                  <td><VarBadge v={dv} invert={l.dir === "out"} /></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

function buildProjectIntoData(d, form, createdBy) {
  let cid = form.clientId;
  if (cid === "__new") {
    const nm = form.clientName.trim();
    const ex = d.clients.find((c) => c.name.toLowerCase() === nm.toLowerCase());
    if (ex) cid = ex.id; else { const c = { id: uid(), name: nm, notes: "" }; d.clients.push(c); cid = c.id; }
  }
  const client = d.clients.find((c) => c.id === cid);
  const start = wkKey(new Date(form.start + "T12:00:00"));
  const weeks = Math.max(1, Number(form.weeks) || 12);
  const toFc = (m) => {
    const out = {};
    Object.entries(m || {}).forEach(([k, v]) => { const n = num(v); if (Math.abs(n) > 0.004) out[k] = n; });
    return out;
  };
  const contractFc = form.contractFc ? toFc(form.contractFc) : cycleFc(start, num(form.value), weeks, "scurve", 6, 4);
  const project = {
    id: uid(), code: form.code, name: form.name, client: client ? client.name : "—", clientId: cid,
    start, weeks, stage: form.stage || "contract", clientInvoices: [],
    completion: form.completion || null, retentionPct: num(form.retentionPct) || null, paymentTerms: Number(form.paymentTerms) || null,
    cashIn: [{ id: uid(), name: "Contract sum", type: "contract", value: num(form.value), fc: contractFc, ac: {} }],

      const ws = wb.Sheets["Overheads"] || wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: null });
      const hi = rows.findIndex((r) => r && String(r[0] || "").trim().toLowerCase() === "line");
      if (hi < 0) throw new Error("Header row not found — column A must be 'Line'.");
      const weekCols = [];
      for (let c = 2; c < rows[hi].length; c++) { const wk = cellToWk(rows[hi][c]); if (wk) weekCols.push({ c, wk }); }
      if (!weekCols.length) throw new Error("No date columns found after column B.");
      const lines = new Map();
      for (let r = hi + 1; r < rows.length; r++) {
        const row = rows[r];
        if (!row || !row[0]) continue;
        const name = String(row[0]).trim();
        const fa = String(row[1] || "f").trim().toLowerCase();
        if (!lines.has(name.toLowerCase())) lines.set(name.toLowerCase(), { name, fc: {}, ac: {} });
        const L = lines.get(name.toLowerCase());
        const map = fa.startsWith("a") ? L.ac : L.fc;
        weekCols.forEach(({ c, wk }) => {
          const v = row[c];
          if (v === null || v === "") return;
          const n = Number(v);
          if (isNaN(n)) return;
          if (!fa.startsWith("a") && n === 0) return;
          map[wk] = (map[wk] || 0) + n;
        });
      }
      if (!lines.size) throw new Error("No overhead lines found.");
      const arr = [...lines.values()];
      const existing = arr.filter((l) => data.overheads.some((o) => o.name.toLowerCase() === l.name.toLowerCase())).length;
      const fcT = arr.reduce((a, l) => a + sumMap(l.fc), 0), acT = arr.reduce((a, l) => a + sumMap(l.ac), 0);
      setPreview({ arr, existing, added: arr.length - existing, weeks: weekCols.length, fcT, acT });
    } catch (ex) { setErr(String(ex.message || ex)); }
  };
  const doImport = () => {
    const d = JSON.parse(JSON.stringify(data));
    preview.arr.forEach((l) => {
      const ex = d.overheads.find((o) => o.name.toLowerCase() === l.name.toLowerCase());
      if (ex) {
        Object.assign(ex.currentFc = ex.currentFc || {}, l.fc);
        if (!Object.keys(ex.baselineFc || {}).length) ex.baselineFc = JSON.parse(JSON.stringify(ex.currentFc));
        Object.assign(ex.ac = ex.ac || {}, l.ac);
      } else d.overheads.push({ id: uid(), name: l.name, recurring: true, baselineFc: JSON.parse(JSON.stringify(l.fc)), currentFc: l.fc, ac: l.ac, inactive: false });
    });
    setData(d); onClose();
  };
  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={(e) => e.stopPropagation()}>
        <h2>Import overheads</h2>
        <div className="sub" style={{ marginBottom: 10 }}>
          Sheet "Overheads": Line · F/A (Forecast/Actual) · date columns (monthly or weekly — amounts land in the week containing each date). Historical actuals + future forecasts in one file. Provided weeks overwrite the same weeks in the app; other weeks are untouched; nothing is deleted.
        </div>
        <div style={{ display: "flex", gap: 8, marginBottom: 12, flexWrap: "wrap" }}>
          <button className="btn" onClick={downloadOhTemplate}>Download template</button>
          <label className="btn amber" style={{ cursor: "pointer" }}>
            Choose file<input type="file" accept=".xlsx,.xls,.csv" style={{ display: "none" }} onChange={pick} />
          </label>
        </div>
        {err && <div style={{ color: "var(--red)", fontFamily: "var(--mono)", fontSize: 12, marginBottom: 10 }}>{err}</div>}
        {preview && (
          <div className="panel" style={{ marginBottom: 12 }}>
            <div style={{ fontFamily: "var(--mono)", fontSize: 13 }}>
              {preview.arr.length} lines ({preview.added} new · {preview.existing} updated) · {preview.weeks} date columns<br />
              Forecast total {moneyK(preview.fcT)} · Actuals total {moneyK(preview.acT)}
            </div>
            <button className="btn amber" style={{ marginTop: 10 }} onClick={doImport}>Import</button>
          </div>
        )}
        <button className="btn ghost" onClick={onClose}>Close</button>
      </div>
    </div>
  );
}
function downloadRegisterTemplate() {
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([
    ["Name", "Type", "Packages", "Notes"],
    ["Apex Building Services", "subcontractor", "M&E Services, BMS", "Preferred M&E partner"],
    ["CityFloor Contracts", "supplier", "Flooring", ""],
    ["Struct-Sure Ltd", "subconsultant", "Structural design", "30-day terms"],
  ]), "Vendors");
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([
    ["Name", "Notes"],
    ["Landsec", "45-day payment terms"],
    ["Brockton Everlast", ""],
  ]), "Clients");
  XLSX.writeFile(wb, "northflow-register-template.xlsx");
}
function parseRegisterRows(ws) {
  const rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: null });
  const hi = rows.findIndex((r) => r && String(r[0] || "").trim().toLowerCase() === "name");
  if (hi < 0) return [];
  return rows.slice(hi + 1).filter((r) => r && String(r[0] || "").trim()).map((r) => ({
    name: String(r[0]).trim(),
    col2: r[1] === null ? "" : String(r[1]).trim(),
    col3: r[2] === null ? "" : String(r[2]).trim(),
    col4: r[3] === null ? "" : String(r[3]).trim(),
  }));
}
function RegisterImport({ data, setData, onClose, defaultKind }) {
  const [preview, setPreview] = useState(null);
  const [err, setErr] = useState(null);
  const pick = async (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    setErr(null); setPreview(null);
    try {
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, { type: "array" });
      let vRows = wb.Sheets["Vendors"] ? parseRegisterRows(wb.Sheets["Vendors"]) : [];
      let cRows = wb.Sheets["Clients"] ? parseRegisterRows(wb.Sheets["Clients"]) : [];
      if (!wb.Sheets["Vendors"] && !wb.Sheets["Clients"]) {
        const first = parseRegisterRows(wb.Sheets[wb.SheetNames[0]]);
        if (defaultKind === "vendors") vRows = first; else cRows = first;
      }
      if (!vRows.length && !cRows.length) throw new Error("No rows found. Column A must be 'Name' with entries below (sheets named Vendors / Clients, or a single sheet).");
      const norm = (s) => s.toLowerCase();
      const vTypes = ["subcontractor", "supplier", "subconsultant"];
      const vendors = vRows.map((r) => {
        const existing = data.vendors.find((v) => norm(v.name) === norm(r.name));
        return { name: r.name, type: vTypes.includes(norm(r.col2)) ? norm(r.col2) : "subcontractor",
          trades: r.col3 ? r.col3.split(",").map((t) => t.trim()).filter(Boolean) : [], notes: r.col4, existing };
      });
      const clients = cRows.map((r) => {
        const existing = data.clients.find((c) => norm(c.name) === norm(r.name));
        return { name: r.name, notes: r.col2, existing };
      });
      setPreview({ vendors, clients });
    } catch (ex) { setErr(String(ex.message || ex)); }
  };
  const doImport = () => {
    const d = JSON.parse(JSON.stringify(data));
    preview.vendors.forEach((r) => {
      const ex = d.vendors.find((v) => v.name.toLowerCase() === r.name.toLowerCase());
      if (ex) { ex.type = r.type; if (r.notes) ex.notes = r.notes; r.trades.forEach((t) => { if (!ex.trades.includes(t)) ex.trades.push(t); }); }
      else d.vendors.push({ id: uid(), name: r.name, type: r.type, trades: r.trades, notes: r.notes });
    });
    preview.clients.forEach((r) => {
      const ex = d.clients.find((c) => c.name.toLowerCase() === r.name.toLowerCase());
      if (ex) { if (r.notes) ex.notes = r.notes; }
      else d.clients.push({ id: uid(), name: r.name, notes: r.notes });
    });
    setData(d); onClose();
  };
  const count = (list, isNew) => list.filter((r) => (isNew ? !r.existing : r.existing)).length;
  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={(e) => e.stopPropagation()}>
        <h2>Bulk upload — vendors & clients</h2>
        <div className="sub" style={{ marginBottom: 10 }}>
          One workbook, sheets named "Vendors" (Name · Type · Packages · Notes) and/or "Clients" (Name · Notes). Existing names are updated and their package lists merged — nothing is deleted.
        </div>
        <div style={{ display: "flex", gap: 8, marginBottom: 12, flexWrap: "wrap" }}>
          <button className="btn" onClick={downloadRegisterTemplate}>Download template</button>
          <label className="btn amber" style={{ cursor: "pointer" }}>
            Choose file<input type="file" accept=".xlsx,.xls,.csv" style={{ display: "none" }} onChange={pick} />
          </label>
        </div>
        {err && <div style={{ color: "var(--red)", fontFamily: "var(--mono)", fontSize: 12, marginBottom: 10 }}>{err}</div>}
        {preview && (
          <div className="panel" style={{ marginBottom: 12 }}>
            <div style={{ fontFamily: "var(--mono)", fontSize: 13 }}>
              Vendors: {count(preview.vendors, true)} new · {count(preview.vendors, false)} updated<br />
              Clients: {count(preview.clients, true)} new · {count(preview.clients, false)} updated
            </div>
            <button className="btn amber" style={{ marginTop: 10 }} onClick={doImport}>Import</button>
          </div>
        )}
        <button className="btn ghost" onClick={onClose}>Close</button>
      </div>
    </div>
  );
}
