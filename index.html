  );
}

function ChainTrack({ ap }) {
  return (
    <div style={{ display: "flex", gap: 6, flexWrap: "wrap", alignItems: "center", fontFamily: "var(--mono)", fontSize: 11, marginTop: 4 }}>
      <span style={{ color: "var(--ink2)" }}>{ap.createdByName}</span>
      {ap.steps.map((s, i) => {
        const cur = currentStep(ap);
        const clr = s.status === "approved" ? "var(--green)" : s.status === "rejected" ? "var(--red)" : s === cur && ap.status === "pending" ? "var(--hivis)" : "var(--ink2)";
        return (
          <span key={i} style={{ color: clr }}>
            → {s.label}{s.status === "approved" ? " ✓" : s.status === "rejected" ? " ✕" : s === cur && ap.status === "pending" ? " ●" : ""}
            {s.name ? " (" + s.name + ")" : ""}
          </span>
        );
      })}
    </div>
  );
}
function ApprovalsView({ data, setData, me }) {
  const mine = data.approvals.filter((a) => a.status === "pending" && currentStep(a) && currentStep(a).role === me.role && a.createdBy !== me.id);
  const submitted = data.approvals.filter((a) => a.createdBy === me.id).sort((a, b) => (a.createdAt < b.createdAt ? 1 : -1));
  const decide = (apId, verdict) => {
    const d = JSON.parse(JSON.stringify(data));
    const ap = d.approvals.find((a) => a.id === apId);
    const step = currentStep(ap);
    if (!step || step.role !== me.role) return;
    step.status = verdict; step.userId = me.id; step.name = me.name; step.at = new Date().toISOString();
    if (verdict === "rejected") ap.status = "rejected";
    else if (ap.steps.every((s) => s.status === "approved")) { ap.status = "approved"; applyApproval(d, ap); }
    setData(d);
  };
  const Summary = ({ ap }) => (
    <div>
      <b>{ap.type === "project" ? "New project — " + ap.summary : "Weekly actuals — " + ap.summary}</b>
      <div className="sub">submitted {new Date(ap.createdAt).toLocaleDateString("en-GB", { day: "numeric", month: "short" })}</div>
      <ChainTrack ap={ap} />
    </div>
  );
  return (
    <div>
      <div className="pagehead"><div><h1>Approvals</h1><div className="sub">Changes go live once every approver has approved.</div></div></div>
      <div className="panel">
        <h2>Waiting for you ({mine.length})</h2>
        {mine.length === 0 && <div className="sub">Nothing needs your approval.</div>}
        {mine.map((ap) => (
          <div key={ap.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 10, flexWrap: "wrap", padding: "10px 0", borderBottom: "1px solid var(--line)" }}>
            <Summary ap={ap} />
            <div style={{ display: "flex", gap: 8 }}>
              <button className="btn" onClick={() => decide(ap.id, "approved")}>Approve</button>
              <button className="btn ghost" onClick={() => decide(ap.id, "rejected")}>Reject</button>
            </div>
          </div>
        ))}
      </div>
      <div className="panel">
        <h2>Your submissions</h2>
        {submitted.length === 0 && <div className="sub">You haven't submitted anything for approval.</div>}
        {submitted.map((ap) => (
          <div key={ap.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 10, flexWrap: "wrap", padding: "10px 0", borderBottom: "1px solid var(--line)" }}>
            <Summary ap={ap} />
            <span className="mono" style={{ fontSize: 12, color: ap.status === "approved" ? "var(--green)" : ap.status === "rejected" ? "var(--red)" : "var(--hivis)" }}>
              {ap.status.toUpperCase()}
            </span>
          </div>
        ))}
      </div>
    </div>
  );
}
function UsersAdmin({ data, setData }) {
  const [name, setName] = useState("");
  const [role, setRole] = useState("qs");
  const toggle = (uId, pId) => {
    const d2 = JSON.parse(JSON.stringify(data));
    const u = d2.users.find((x) => x.id === uId);
    if (u.projects.includes(pId)) u.projects = u.projects.filter((x) => x !== pId);
    else u.projects.push(pId);
    setData(d2);
  };
  const addUser = () => {
    if (!name.trim()) return;
    setData({ ...data, users: [...data.users, { id: uid(), name: name.trim(), role, profitAccess: role === "director", projects: isMgmtRole(role) ? data.projects.map((p) => p.id) : [] }] });
    setName("");
  };
  const exportBackup = () => {
    const blob = new Blob([JSON.stringify(data, null, 1)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "flowline-backup-" + CUR_WK + ".json";
    a.click();
  };
  return (
    <div>
      <div className="pagehead">
        <div><h1>Team & access</h1><div className="sub">One designation per person. QS & PM: assigned projects only. PD & HoC: all projects + roll-up dashboard, no corporate. Accountant: everything except profit. Director: everything.</div></div>
        <div style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap" }}>
          <label style={{ fontSize: 13, display: "flex", alignItems: "center", gap: 6, fontFamily: "var(--mono)" }}>
            <input type="checkbox" checked={!!data.settings.loginRequired}
              onChange={() => setData({ ...data, settings: { ...data.settings, loginRequired: !data.settings.loginRequired } })} />
            Require passwords{data.settings.loginRequired ? " (live)" : " (off — pre-go-live)"}
          </label>
          <label className="btn ghost" style={{ cursor: "pointer" }}>
            Import data (JSON)<input type="file" accept=".json" style={{ display: "none" }} onChange={async (e) => {
              const file = e.target.files && e.target.files[0];
              if (!file) return;
              try {
                const obj = JSON.parse(await file.text());
                const incoming = Array.isArray(obj) ? obj : obj.projects;
                if (!Array.isArray(incoming) || !incoming.length) { alert("No projects found in file."); return; }
                const d = JSON.parse(JSON.stringify(data));
                let added = 0, skipped = 0;
                incoming.forEach((p) => {
                  if (d.projects.some((x) => x.code.toLowerCase() === String(p.code).toLowerCase())) { skipped++; return; }
                  d.projects.push(p); added++;
                });
                ensureVendors(d);
                d.users.forEach((u) => { if (isMgmtRole(u.role)) d.projects.forEach((p) => { if (!u.projects.includes(p.id)) u.projects.push(p.id); }); });
                setData(d);
                alert(added + " project(s) imported" + (skipped ? ", " + skipped + " skipped (code already exists)" : "") + ".");
              } catch (ex) { alert("Couldn't read that file: " + (ex.message || ex)); }
              e.target.value = "";
            }} />
          </label>
          <button className="btn ghost" onClick={exportBackup}>Download JSON backup</button>
        </div>
      </div>
      <div className="panel">
        <div className="frow" style={{ alignItems: "flex-end" }}>
          <Field label="Name"><input value={name} onChange={(e) => setName(e.target.value)} /></Field>
          <Field label="Role">
            <select value={role} onChange={(e) => setRole(e.target.value)}>
              {ROLES.map(([v, l]) => <option key={v} value={v}>{l}</option>)}
            </select>
          </Field>
          <div className="field" style={{ minWidth: 100, display: "flex", alignItems: "flex-end" }}><button className="btn" onClick={addUser}>Add user</button></div>
        </div>
      </div>
      <div className="panel" style={{ padding: 0, overflowX: "auto" }}>
        <table className="tbl">
          <thead><tr><th>User</th><th>Role</th><th>Password</th><th>Profit access</th>{data.projects.map((p) => <th key={p.id} className="mono">{p.code}</th>)}</tr></thead>
          <tbody>
            {data.users.map((u) => (
              <tr key={u.id}>
                <td>{u.name}</td>
                <td><span className={"badge " + (isMgmtRole(u.role) ? "a" : "b")}>{ROLE_LABEL[u.role] || u.role}</span></td>
                <td style={{ whiteSpace: "nowrap" }}>
                  <button className="btn ghost sm" disabled={!u.pw} onClick={() => setData({ ...data, users: data.users.map((x) => (x.id === u.id ? { ...x, pw: null } : x)) })}>{u.pw ? "Reset" : "Not set"}</button>
                </td>
                <td>
                  <input type="checkbox" checked={!!u.profitAccess} disabled={u.role !== "director"}
                    onChange={() => setData({ ...data, users: data.users.map((x) => (x.id === u.id ? { ...x, profitAccess: !x.profitAccess } : x)) })} />
                </td>
                {data.projects.map((p) => (
                  <td key={p.id}>
                    <input type="checkbox" checked={accessOf(u.role).allProjects || u.projects.includes(p.id)} disabled={accessOf(u.role).allProjects} onChange={() => toggle(u.id, p.id)} />
                  </td>
                ))}
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      <p className="note">Prototype note: everyone in this workspace shares one live dataset, and access control is applied by the app after sign-in — it demonstrates the workflow but is not real security. At deployment the same rules become server-enforced logins.</p>
    </div>
  );
}

/* ---------------- sign in ---------------- */
async function sha256(text) {
  if (window.crypto && window.crypto.subtle) {
    const buf = await window.crypto.subtle.digest("SHA-256", new TextEncoder().encode("nf·" + text));
    return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, "0")).join("");
  }
  let h = 5381; const s = "nf·" + text;
  for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0;
  return "djb" + (h >>> 0).toString(16);
}
function SignIn({ users, onAuth, setPassword, loginRequired }) {
  const [picked, setPicked] = useState(null);
  const [pw, setPw] = useState("");
  const [pw2, setPw2] = useState("");
  const [err, setErr] = useState(null);
  const [busy, setBusy] = useState(false);
  const u = users.find((x) => x.id === picked);
  const firstTime = u && !u.pw;
  const go = async () => {
    setBusy(true); setErr(null);
    if (firstTime) {
      if (pw.length < 4) { setErr("Password must be at least 4 characters."); setBusy(false); return; }
      if (pw !== pw2) { setErr("Passwords don't match."); setBusy(false); return; }
      const hash = await sha256(pw);
      setPassword(u.id, hash);
      onAuth(u.id);
    } else {
      const hash = await sha256(pw);
      if (hash === u.pw) onAuth(u.id);
      else setErr("Wrong password. If you've forgotten it, ask an administrator to reset it in Team & access.");
    }
    setBusy(false);
  };
  return (
    <div className="gate">
      <div className="gatecard">
        <div className="logo"><img src={NF_MARK} alt="" />North<span>Flow</span></div>
        <div style={{ fontFamily: "var(--mono)", fontSize: 11, color: "var(--ink2)", marginBottom: 14 }}>project & corporate cashflow · v{APP_VERSION}</div>
        {!u && users.map((x) => (
          <button className="userbtn" key={x.id} onClick={() => { if (!loginRequired) { onAuth(x.id); return; } setPicked(x.id); setErr(null); setPw(""); setPw2(""); }}>
            <span>{x.name}</span>
            <span className={"badge " + (isMgmtRole(x.role) ? "a" : "b")}>{ROLE_LABEL[x.role] || x.role}</span>
          </button>
        ))}
        {u && (
          <div>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
              <b>{u.name}</b>
              <button className="btn ghost sm" onClick={() => setPicked(null)}>Not you?</button>
            </div>
            {firstTime && <p className="note" style={{ marginTop: 0, marginBottom: 10 }}>First sign-in — set your password.</p>}
            <div className="frow"><Field label={firstTime ? "New password" : "Password"}>
              <input type="password" value={pw} onChange={(e) => setPw(e.target.value)} onKeyDown={(e) => e.key === "Enter" && !firstTime && go()} autoFocus />
            </Field></div>
            {firstTime && <div className="frow"><Field label="Repeat password">
              <input type="password" value={pw2} onChange={(e) => setPw2(e.target.value)} onKeyDown={(e) => e.key === "Enter" && go()} />
            </Field></div>}
            {err && <div style={{ color: "var(--red)", fontSize: 12, marginBottom: 8 }}>{err}</div>}
            <button className="btn amber" style={{ width: "100%" }} disabled={busy || !pw} onClick={go}>{firstTime ? "Set password & sign in" : "Sign in"}</button>
          </div>
        )}
        <p className="note">{loginRequired ? "Your sign-in determines what you can see — tabs and data outside your designation aren't shown." : "Passwords are currently off (pre-go-live). Pick a profile to enter — turn passwords on in Team & access when you go live."}</p>
      </div>
    </div>
  );
}

/* ---------------- app ---------------- */
function App() {
  const [data, setDataState] = useState(null);
  const [loadErr, setLoadErr] = useState(null);
  const [memMode, setMemMode] = useState(false);
  const [userId, setUserId] = useState(null);
  const [tab, setTab] = useState("dashboard");
  const [projectId, setProjectId] = useState(null);

  const load = async () => {
    setLoadErr(null);
    const hasApi = typeof window !== "undefined" && window.storage && typeof window.storage.get === "function";
    if (!hasApi) { setMemMode(true); setDataState(ensureVendors(seedData())); return; }
    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
    const parseAndMigrate = async (raw) => {
      try { return ensureVendors(JSON.parse(raw)); }
      catch (e) {
        // Brief §3: never silently discard data on migration failure — preserve + report.
        const bk = STORE_KEY + ":backup-" + Date.now();
        try { await window.storage.set(bk, raw, true); } catch (_) {}
        window.__nfBackupRaw = raw;
        const err = new Error("Schema migration failed: " + (e.message || e) + ". Your existing data was preserved (backup key " + bk + ") and can be downloaded below. Nothing has been overwritten.");
        err.isMigration = true;
        throw err;
      }
    };
    let lastErr = null;
    for (let i = 0; i < 3; i++) {
      try {
        const r = await window.storage.get(STORE_KEY, true);
        setDataState(await parseAndMigrate(r.value));
        return;
      } catch (e) { lastErr = e; if (e.isMigration) { setLoadErr(String(e.message)); return; } if (i < 2) await sleep(600 * (i + 1)); }
    }
    // get failed 3x — either storage is down, or the key doesn't exist yet.
    // Probe storage health; only seed if storage is up (key genuinely absent).
    try {
      await window.storage.set("flowline:probe", String(Date.now()), true);
      try {
        const r = await window.storage.get(STORE_KEY, true);
        setDataState(await parseAndMigrate(r.value));
      } catch (e) {
        if (e.isMigration) { setLoadErr(String(e.message)); return; }
        const fresh = ensureVendors(seedData());
        await window.storage.set(STORE_KEY, JSON.stringify(fresh), true);
        setDataState(fresh);
      }
    } catch (e2) { setLoadErr(String((e2 && e2.message) || lastErr && lastErr.message || "unknown storage error")); }
  };
  useEffect(() => { load(); }, []);
  useEffect(() => {
    if (!data || userId || memMode || !window.storage) return;
    if (data.settings.loginRequired) return;
    window.storage.get("northflow:me", false).then((r) => {
      const id = r && r.value;
      if (id && data.users.some((u) => u.id === id)) setUserId(id);
    }).catch(() => {});
  }, [data]);

  const setData = (next) => {
    setDataState(next);
    if (!memMode && window.storage) window.storage.set(STORE_KEY, JSON.stringify(next), true).catch(() => {});
  };
  const saveProject = (p2) => {
    setData({ ...data, projects: data.projects.map((p) => (p.id === p2.id ? p2 : p)) });
  };
  const mutate = (fn) => { const d = JSON.parse(JSON.stringify(data)); fn(d); setData(d); };

  if (loadErr) return (
    <div className="fl" style={{ padding: 30 }}>
      <style>{CSS}</style>
      <div style={{ marginBottom: 8 }}>Couldn't reach storage. Saved data is untouched — retry, or continue without saving to look around.</div>
      <div style={{ marginBottom: 14, fontFamily: "monospace", fontSize: 11, opacity: 0.6 }}>Detail: {loadErr}</div>
      <button className="btn" onClick={load} style={{ marginRight: 10 }}>Retry</button>
      {window.__nfBackupRaw && <button className="btn" onClick={() => { const b = new Blob([window.__nfBackupRaw], { type: "application/json" }); const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = "northflow-backup.json"; a.click(); }}>Download data backup</button>}{" "}
      <button className="btn" onClick={() => { setLoadErr(null); setMemMode(true); setDataState(ensureVendors(seedData())); }}>Continue without saving</button>
    </div>
  );
  if (!data) return <div className="fl" style={{ padding: 30, fontFamily: "monospace" }}><style>{CSS}</style>Loading cashflows…</div>;

  const user = data.users.find((u) => u.id === userId);
  if (!user) return <div className="fl"><style>{CSS}</style><SignIn users={data.users}
    loginRequired={!!data.settings.loginRequired}
    setPassword={(id, hash) => setData({ ...data, users: data.users.map((u) => (u.id === id ? { ...u, pw: hash } : u)) })}
    onAuth={(id) => { setUserId(id); setTab("dashboard"); setProjectId(null); if (!memMode && window.storage && !data.settings.loginRequired) window.storage.set("northflow:me", id, false).catch(() => {}); }} /></div>;

  const isMgmt = isMgmtRole(user.role);
  const acc = accessOf(user.role);
  VAT_F = data.settings.vatIncl ? 1 + (data.settings.vatRate ?? 0.05) : 1;
  ACTUALS_THROUGH = data.settings.actualsThrough || null;
  const myProjects = data.projects.filter((p) => acc.allProjects || user.projects.includes(p.id));
  const openProject = (id) => { setProjectId(id); setTab("project"); };
  const activeProject = data.projects.find((p) => p.id === projectId);
  const canSeeActive = activeProject && (acc.allProjects || user.projects.includes(activeProject.id));

  const NavBtn = ({ id, label }) => (
    <button className={tab === id || (id === "projects" && tab === "project") ? "on" : ""} onClick={() => { setTab(id); if (id !== "project") setProjectId(null); }}>{label}</button>
  );

  return (
    <div className="fl">
      <style>{CSS}</style>
      {memMode && <div style={{ background: "#B34A2E", color: "#fff", padding: "8px 14px", fontFamily: "var(--mono)", fontSize: 12 }}>Working without saving — storage is unreachable, changes will be lost when you close.</div>}
      <div className="shell">
        <div className="side">
          <div className="logo"><img src={NF_MARK} alt="" />North<span>Flow</span></div>
          <div className="logo-sub">{data.settings.company} · cash control</div>
          <div className="nav">
            <NavBtn id="dashboard" label="Dashboard" />
            {acc.corporate && <NavBtn id="corporate" label="Corporate" />}
            {acc.corporate && <NavBtn id="overheads" label="Overheads" />}
            <NavBtn id="projects" label="Projects" />
            <NavBtn id="approvals" label={"Approvals" + ((n) => (n ? " (" + n + ")" : ""))(data.approvals.filter((a) => a.status === "pending" && currentStep(a) && currentStep(a).role === user.role && a.createdBy !== user.id).length)} />
            {acc.registers && <NavBtn id="clients" label="Clients" />}
            {acc.registers && <NavBtn id="vendors" label="Vendors" />}
            {acc.team && <NavBtn id="users" label="Team & access" />}
          </div>
          <div style={{ padding: "10px 14px" }}>
            <div className="seg" style={{ background: "transparent", borderColor: "#1B3A7A" }}>
              {[[false, "Excl VAT"], [true, "Incl VAT"]].map(([v, l]) => (
                <button key={l} className={!!data.settings.vatIncl === v ? "on" : ""} style={{ color: !!data.settings.vatIncl === v ? undefined : "#93A3C7" }}
                  onClick={() => setData({ ...data, settings: { ...data.settings, vatIncl: v } })}>{l}</button>
              ))}
            </div>
          </div>
          <div className="side-foot">
            <b>{user.name}</b>{ROLE_LABEL[user.role] || user.role}
            <div><button onClick={() => { setUserId(null); if (!memMode && window.storage) window.storage.delete("northflow:me", false).catch(() => {}); }}>Switch user</button></div>
            <div style={{ marginTop: 8, fontFamily: "var(--mono)", fontSize: 10 }}>v{APP_VERSION} · w/c {fmtWk(CUR_WK)}</div>
          </div>
        </div>
        <div className="main">
          {tab === "dashboard" && acc.dashboard && <Dashboard data={data} projects={myProjects} openProject={openProject} scope={acc.dashboard} />}
          {tab === "projects" && (
            <ProjectsList projects={myProjects} users={data.users} openProject={openProject} canCreate={true} canImport={acc.allProjects} data={data} isMgmt={isMgmt} role={user.role}
              onWizardSubmit={(form) => {
                const d = JSON.parse(JSON.stringify(data));
                const ap = makeApproval(d, "project", user.id, { form }, form.code + " " + form.name + " (" + money(num(form.value)) + ")");
                let created = null;
                if (ap) d.approvals.push(ap); else created = buildProjectIntoData(d, form, user.id);
                setData(d);
                if (created) openProject(created.id);
              }}
              onCreate={(p) => { setData({ ...data, projects: [...data.projects, p] }); }}
              onImport={(p, replaceId) => {
                if (replaceId) setData(ensureVendors({ ...data, projects: data.projects.map((x) => (x.id === replaceId ? { ...p, id: replaceId } : x)) }));
                else setData(ensureVendors({ ...data, projects: [...data.projects, p] }));
              }} />
          )}
          {tab === "project" && canSeeActive && (
            <ProjectView project={activeProject} saveProject={saveProject} vendors={data.vendors} mutate={mutate} isMgmt={isMgmt} ohRate={ohRateFor(data.settings, new Date().getFullYear())} submitActuals={(wk, vals) => { const d = JSON.parse(JSON.stringify(data)); const ap = makeApproval(d, "actuals", user.id, { projectId: activeProject.id, wk, vals }, activeProject.code + " w/c " + fmtWk(wk)); if (ap) { d.approvals.push(ap); setData(d); return true; } applyApproval(d, { type: "actuals", payload: { projectId: activeProject.id, wk, vals } }); setData(d); return false; }} onBack={() => { setTab("projects"); setProjectId(null); }} canEdit={true} />
          )}
          {tab === "project" && !canSeeActive && <div className="panel">You don't have access to this project. Ask management to assign it to you in Team & access.</div>}
          {tab === "corporate" && acc.corporate && <CorporateView data={data} setData={setData} me={user} canProfit={acc.profit} />}
          {tab === "overheads" && acc.corporate && <OverheadsView data={data} setData={setData} />}
          {tab === "vendors" && acc.registers && <VendorsView data={data} setData={setData} openProject={openProject} />}
          {tab === "clients" && acc.registers && <ClientsView data={data} setData={setData} openProject={openProject} />}
          {tab === "approvals" && <ApprovalsView data={data} setData={setData} me={user} />}
          {tab === "users" && acc.team && <UsersAdmin data={data} setData={setData} />}
        </div>
      </div>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
